# sqlc: генерация типобезопасного Go-кода из SQL (pgx/v5).
# Схема — миграции goose (sqlc понимает разметку -- +goose Up/Down и берёт только Up).
# Запуск из корня репозитория: sqlc generate && sqlc vet
version: "2"
sql:
  - engine: postgresql
    schema: db/migrations
    queries: db/queries
    gen:
      go:
        package: store
        out: server/internal/store
        sql_package: pgx/v5
        emit_json_tags: true
        emit_interface: false
        emit_pointers_for_null_types: true
        # Типы времени и JSON — единообразно: NOT NULL → значение, NULL → указатель.
        overrides:
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
          - db_type: date
            go_type: time.Time
          - db_type: date
            nullable: true
            go_type:
              type: time.Time
              pointer: true
          - db_type: jsonb
            go_type: encoding/json.RawMessage
          - db_type: jsonb
            nullable: true
            go_type: encoding/json.RawMessage
    rules:
      - tenant-filter
rules:
  # Каждый запрос обязан фильтровать по club_id (тенантность, см. CLAUDE.md).
  # Исключения — только платформенные запросы, перечисленные явно.
  # ExpireDueSessions — воркер истечения сессий по всем клубам (роль zafiro_platform, advisory lock).
  # ListExpiredTimePackages — воркер сгорания пакетов по всем клубам (роль zafiro_platform, Q-011).
  # GetUserByPhone, GetUserAuth, UpdateUserPasswordHash — платформенная таблица users (без club_id и RLS), вход.
  # Register*, InvitationUserEmail, ClubLocaleTimezone — users/clubs/saas_plans при регистрации и входе (Этап 3, F1).
  # I18n* — платформенные languages/translations (общие для всех клубов).
  # ClubMapSettings, AgentReleaseSetting — clubs (настройки клуба из сессии) и platform_settings (релиз агента), Этап 3 G1.
  # AdminAccountsLocked, AdminUserConflicts — users (платформенная) и роли во всех клубах (пул zafiro_platform), клиенты (Этап 3, G3).
  # SettingsLanguages — платформенные languages; SettingsClub, SettingsLockClub, SettingsSave, SettingsSet* — строка clubs
  # клуба из сессии (WHERE id = club_id), экран настроек клуба (Этап 3, G5).
  # Superadmin*, Monitoring* — суперадминка и сбор метрик (Этап 3, G6): кабинет платформы по всем клубам, пул
  # zafiro_platform (db/queries/superadmin.sql, monitoring.sql); только эти разделы вызывают запросы с этими префиксами.
  # PublicLanding — saas_plans и platform_settings для лендинга (Этап 3, G7).
  # Telegram* — настройки Telegram, коды восстановления пароля и лимиты кодов перевода на аккаунт во всех клубах
  # (Этап 4, H2; db/queries/telegram.sql, пул zafiro_platform).
  # SecretsPlatformSettingsToReseal, SecretsResealPlatformSetting — перешифровка токенов platform_settings воркером
  # reencrypt-secrets (Этап 4, H4; db/queries/secrets.sql).
  - name: tenant-filter
    message: "запрос должен фильтровать по club_id (или быть в списке платформенных исключений в sqlc.yaml)"
    rule: |
      !query.sql.contains("club_id") && !query.name.startsWith("Superadmin") && !query.name.startsWith("Monitoring") && !query.name.startsWith("Telegram") && !(query.name in ["GetClub", "GetClubBySlug", "ExpireDueSessions", "ListExpiredTimePackages", "GetUserByPhone", "GetUserAuth", "UpdateUserPasswordHash", "RegisterCreateUser", "RegisterPhoneTaken", "RegisterCreateClub", "RegisterTrialPlan", "InvitationUserEmail", "ClubLocaleTimezone", "I18nEnabledLanguages", "I18nVersion", "I18nLines", "I18nEnsureLanguage", "I18nLanguageID", "I18nInsertMissing", "AdminAccountsLocked", "AdminUserConflicts", "ClubMapSettings", "AgentReleaseSetting", "SettingsLanguages", "SettingsClub", "SettingsLockClub", "SettingsSave", "SettingsSetTimezone", "SettingsSetLocale", "SettingsSetAgentPin", "SettingsSetStaffMinutes", "SettingsSetLogoPath", "SettingsSetSigninImagePath", "PublicLanding", "SecretsPlatformSettingsToReseal", "SecretsResealPlatformSetting"])
