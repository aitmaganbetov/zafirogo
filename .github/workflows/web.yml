name: web

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: web

jobs:
  web:
    name: lint, typecheck, test, build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: versions (tools/versions.env — единственное место версий инструментов)
        working-directory: .
        shell: bash
        run: grep -E '^[A-Z_]+=' tools/versions.env | tr -d '\r' >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - name: API types are up to date
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/gen
          test -z "$(git status --porcelain -- src/api/gen)"
      - run: npm test
      - run: npm run build
      # Бюджет размера (аудит FE-11): входной чанк, начальная загрузка, CSS, самый большой чанк — gzip.
      # Пороги — в tools/bundle-budget.mjs (сейчас «текущее + 10 %», уменьшаются по мере работ над фронтом).
      - name: bundle budget
        working-directory: .
        shell: bash   # pipefail: падение скрипта не теряется за tee
        run: node tools/bundle-budget.mjs web/dist | tee -a "$GITHUB_STEP_SUMMARY"

  e2e:
    name: playwright e2e
    runs-on: ubuntu-24.04
    needs: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: versions (tools/versions.env — единственное место версий инструментов)
        working-directory: .
        shell: bash
        run: grep -E '^[A-Z_]+=' tools/versions.env | tr -d '\r' >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
        env:
          CI: "true"
