name: image-scan

# Еженедельный пересмотр уязвимостей уже выпущенного образа (аудит OPS-17): trivy при сборке (release.yml) видит
# только базу CVE на момент выпуска; новые уязвимости в работающей версии иначе незаметны. Сканируется последний тег v*
# из GHCR тем же trivy, что в release.yml (HIGH/CRITICAL — красный прогон; исключения — deploy/trivy-ignore.yaml).
# Красный прогон — повод выпустить патч-версию (обновить базовый образ/зависимость), а не только смотреть отчёт.
on:
  schedule:
    # Среда 03:37 UTC — вне часов пик клубов (UTC+5) и не в начале часа.
    - cron: "37 3 * * 3"
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег образа (v1.2.3); пусто — последний v*"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: image-scan
  cancel-in-progress: false

env:
  # Тот же образ trivy, что в release.yml (PD-4: версия и digest).
  TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222

jobs:
  scan:
    name: trivy последнего выпущенного образа
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read # docker pull из GHCR (закрытый пакет)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: тег
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          tag="${INPUT_TAG:-$(git tag -l 'v*' --sort=-v:refname | head -1)}"
          if [ -z "$tag" ]; then
            echo "::notice::выпусков v* ещё нет — сканировать нечего"
            echo "tag=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          case "$tag" in *[!A-Za-z0-9._-]*) echo "::error::тег «$tag»"; exit 1;; esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$(echo "$REPO" | tr '[:upper:]' '[:lower:]'):$tag" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: steps.tag.outputs.tag != ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: trivy (HIGH/CRITICAL fail)
        if: steps.tag.outputs.tag != ''
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
        run: |
          docker pull "$IMAGE"
          docker save "$IMAGE" -o image.tar
          echo "Образ: \`$IMAGE@$(docker inspect -f '{{index .RepoDigests 0}}' "$IMAGE" | cut -d@ -f2)\`" >> "$GITHUB_STEP_SUMMARY"
          docker run --rm -v "$PWD:/src" -w /src "$TRIVY_IMAGE" image --input image.tar \
            --scanners vuln --severity HIGH,CRITICAL --exit-code 1 \
            --ignorefile deploy/trivy-ignore.yaml --no-progress
