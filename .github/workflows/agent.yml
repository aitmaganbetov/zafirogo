name: agent

# Агент ПК (.NET 10, agent/): сборка (служба, UI WPF/WebView2 — на Linux через EnableWindowsTargeting) и unit-тесты
# на Windows и Linux, тесты страницы UI (Node), Native AOT службы, интеграционные тесты против Go-сервера (Postgres,
# Valkey, NATS в Docker). Локально то же — agent/test.sh unit|frontend|integration|aot.
on:
  push:
    branches: [main]
    paths:
      - agent/**
      - proto/**
      - server/**
      - db/**
      - tools/visual/fixtures/**
      - tools/versions.env
      - .github/workflows/agent.yml
  pull_request:
    paths:
      - agent/**
      - proto/**
      - server/**
      - db/**
      - tools/visual/fixtures/**
      - tools/versions.env
      - .github/workflows/agent.yml

permissions:
  contents: read

concurrency:
  group: agent-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

defaults:
  run:
    working-directory: agent
    shell: bash

jobs:
  build:
    name: build + unit (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Конкретные образы раннеров (аудит BC-09): *-latest меняется без предупреждения.
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: versions (tools/versions.env — единственное место версий инструментов)
        working-directory: .
        shell: bash
        run: grep -E '^[A-Z_]+=' tools/versions.env | tr -d '\r' >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: agent/global.json
      - name: restore (lock-файлы)
        run: dotnet restore ZafiroAgent.slnx --locked-mode
      - name: build (предупреждения — ошибки, анализаторы AOT и платформ)
        run: dotnet build ZafiroAgent.slnx -c Release --no-restore
      - name: unit tests
        run: dotnet test tests/Zafiro.Agent.Tests/Zafiro.Agent.Tests.csproj -c Release --no-build --filter "Category!=Integration" --logger "console;verbosity=normal"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: frontend tests (мост, деньги, CSP — без WebView2)
        run: node --test tests/frontend/*.test.mjs
      - name: Native AOT publish (служба)
        run: |
          rid=${{ runner.os == 'Windows' && 'win-x64' || 'linux-x64' }}
          dotnet publish src/Zafiro.Agent.Service/Zafiro.Agent.Service.csproj -c Release -r "$rid" -p:PublishAot=true \
            -p:RestoreLockedMode=false -o "$RUNNER_TEMP/aot" 2>&1 | tee "$RUNNER_TEMP/aot.log"
          if grep -E 'warning (IL|SYSLIB)' "$RUNNER_TEMP/aot.log"; then echo "AOT/trim warnings"; exit 1; fi
          "$RUNNER_TEMP/aot/Zafiro.Agent.Service" --version

  integration:
    name: integration (Go server)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: versions (tools/versions.env — единственное место версий инструментов)
        working-directory: .
        shell: bash
        run: grep -E '^[A-Z_]+=' tools/versions.env | tr -d '\r' >> "$GITHUB_ENV"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: agent/global.json
      - name: goose
        run: go install github.com/pressly/goose/v3/cmd/goose@${GOOSE_VERSION}
      - name: start server (compose + migrations + demo club + dev PKI)
        run: |
          env_file="$(tests/integration/server.sh start)"
          cat "$env_file" >> "$GITHUB_ENV"
      - name: restore + build
        run: |
          dotnet restore ZafiroAgent.slnx --locked-mode
          dotnet build ZafiroAgent.slnx -c Release --no-restore
      - name: integration tests
        run: dotnet test tests/Zafiro.Agent.Tests/Zafiro.Agent.Tests.csproj -c Release --no-build --filter "Category=Integration" --logger "console;verbosity=detailed"
      - name: server log
        if: failure()
        run: tail -200 "$ZAFIRO_IT_SERVER_LOG" || true
      - name: stop server
        if: always()
        run: tests/integration/server.sh stop
