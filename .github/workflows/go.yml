name: go

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: go-${{ github.ref }}
  cancel-in-progress: true

# Версии инструментов (golangci-lint, govulncheck, gosec, goose, sqlc, buf, oapi-codegen, task) — tools/versions.env;
# шаг «versions» кладёт их в окружение задачи.

defaults:
  run:
    working-directory: server

jobs:
  lint:
    name: vet, lint, security
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: versions (tools/versions.env — единственное место версий инструментов)
        working-directory: .
        shell: bash
        run: grep -E '^[A-Z_]+=' tools/versions.env | tr -d '\r' >> "$GITHUB_ENV"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: versions are defined once (tools/check-versions.sh)
        working-directory: .
        run: sh tools/check-versions.sh
      # Одна версия Go везде (аудит SEC-3/SEC-4): server/go.mod, GO_VERSION в tools/versions.env, образ сборки сервера
      # (Dockerfile) и WAL-G (deploy/backup/Dockerfile — бинарник в контейнере БД ходит в S3 по TLS).
      - name: one Go version (go.mod, versions.env, Dockerfiles)
        working-directory: .
        run: |
          mod=$(sed -n 's/^go \([0-9.]*\)$/\1/p' server/go.mod)
          fail=0
          for pair in "tools/versions.env:$GO_VERSION" \
            "Dockerfile:$(sed -n 's/^ARG GO_IMAGE=golang:\([0-9.]*\)-.*/\1/p' Dockerfile)" \
            "deploy/backup/Dockerfile:$(sed -n 's/^ARG GO_IMAGE=golang:\([0-9.]*\)-.*/\1/p' deploy/backup/Dockerfile)"; do
            if [ "${pair#*:}" != "$mod" ]; then echo "::error::${pair%%:*}: Go ${pair#*:}, server/go.mod: $mod"; fail=1; fi
          done
          exit "$fail"
      - name: go vet
        run: |
          go vet ./...
          go vet -tags=integration ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: server
          args: --config=../.golangci.yml
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@"${GOVULNCHECK_VERSION}"
          govulncheck ./...
      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@"${GOSEC_VERSION}"
          gosec -quiet -exclude-generated -exclude-dir=gen -exclude-dir=store ./...

  # Сгенерированный код и правила над исходниками (аудит BC-02): правило тенантности tenant-filter (sqlc vet),
  # sqlc / oapi-codegen / buf generate не меняют дерево, buf lint, buf breaking против базовой ветки PR.
  # Типы API фронта (openapi-typescript) сверяет web.yml.
  generated:
    name: sqlc vet, buf lint/breaking, generated code is up to date
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: versions (tools/versions.env — единственное место версий инструментов)
        working-directory: .
        shell: bash
        run: grep -E '^[A-Z_]+=' tools/versions.env | tr -d '\r' >> "$GITHUB_ENV"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: генераторы (версии — tools/versions.env)
        run: |
          go install github.com/go-task/task/v3/cmd/task@"${TASK_VERSION}"
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@"${SQLC_VERSION}"
          go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@"${OAPI_CODEGEN_VERSION}"
          go install github.com/bufbuild/buf/cmd/buf@"${BUF_VERSION}"
          go install google.golang.org/protobuf/cmd/protoc-gen-go@"${PROTOC_GEN_GO_VERSION}"
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@"${PROTOC_GEN_GO_GRPC_VERSION}"
      - name: sqlc vet (tenant-filter), buf lint, sqlc / oapi-codegen / buf generate без диффа
        working-directory: .
        run: task gen:check:go
      # Контракт агента: несовместимое изменение proto ломает уже установленных агентов. Осознанное изменение
      # (до первого выпуска агента, решение 3 в CLAUDE.md) — метка PR «proto-breaking».
      - name: базовая ветка (proto) для buf breaking
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'proto-breaking')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.base_ref }}
          path: .buf-base
          persist-credentials: false
          sparse-checkout: |
            proto
            buf.yaml
      - name: buf breaking (против базовой ветки PR)
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'proto-breaking')
        working-directory: .
        run: task proto:breaking AGAINST=.buf-base

  test:
    name: unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go test -race -count=1 ./...

  # Переводы: каждый ключ фронта и сервера переведён на ru/kk/en — в database/translations старого проекта или в
  # db/seed/translations-new.*.json (server/internal/i18n/coverage_test.go). Старый репозиторий — только чтение.
  translations:
    name: translations ru/kk/en
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aitmaganbetov/Zafiro
          path: legacy/Zafiro
          token: ${{ secrets.ZAFIRO_LEGACY_TOKEN || github.token }}
          persist-credentials: false
          sparse-checkout: database/translations
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: every key translated
        env:
          ZAFIRO_LEGACY_TRANSLATIONS: ${{ github.workspace }}/legacy/Zafiro/database/translations
          ZAFIRO_REQUIRE_LEGACY: "1"
        run: go test -count=1 -run 'TestEveryKeyTranslated|TestSeedTranslations' ./internal/i18n/

  integration:
    name: integration tests + migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        # Тот же digest, что в docker-compose.dev.yml и deploy/staging (тег пересобирается выше по течению, BK-12).
        image: postgres:18.6@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
        env:
          POSTGRES_DB: zafiro_test
          POSTGRES_USER: zafiro
          POSTGRES_PASSWORD: zafiro_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zafiro -d zafiro_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      ZAFIRO_TEST_DATABASE_URL: postgres://zafiro:zafiro_ci@localhost:5432/zafiro_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: versions (tools/versions.env — единственное место версий инструментов)
        working-directory: .
        shell: bash
        run: grep -E '^[A-Z_]+=' tools/versions.env | tr -d '\r' >> "$GITHUB_ENV"
      - name: goose up (db/migrations)
        working-directory: .
        run: |
          go install github.com/pressly/goose/v3/cmd/goose@"${GOOSE_VERSION}"
          goose -env=none -dir db/migrations postgres "$ZAFIRO_TEST_DATABASE_URL" up
          goose -env=none -dir db/migrations postgres "$ZAFIRO_TEST_DATABASE_URL" status
      - name: goose down-to 0 and up again (миграции обратимы)
        working-directory: .
        run: |
          goose -env=none -dir db/migrations postgres "$ZAFIRO_TEST_DATABASE_URL" down-to 0
          goose -env=none -dir db/migrations postgres "$ZAFIRO_TEST_DATABASE_URL" up
      - name: integration tests
        env:
          # Ryuk (reaper testcontainers) не нужен на одноразовом раннере: контейнеры удаляются вместе с ним.
          # Под нагрузкой параллельных пакетов его запуск упирался в таймаут (TestValkeyZNonces: wait for reaper).
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: go test -race -count=1 -tags=integration ./...

  build:
    name: build binary
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: go build (без фронта — заглушка webui)
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w" -o ../bin/zafiro ./cmd/zafiro
      - name: smoke /healthz
        working-directory: .
        run: |
          ./bin/zafiro & pid=$!
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz; then break; fi
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:8080/healthz | grep -q '"status":"ok"'
          kill -TERM "$pid"
          wait "$pid"
