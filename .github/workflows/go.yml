name: go

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: go-${{ github.ref }}
  cancel-in-progress: true

env:
  GOLANGCI_LINT_VERSION: v2.15.0
  GOVULNCHECK_VERSION: v1.9.0
  GOSEC_VERSION: v2.30.0
  GOOSE_VERSION: v3.29.0

defaults:
  run:
    working-directory: server

jobs:
  lint:
    name: vet, lint, security
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: go vet
        run: |
          go vet ./...
          go vet -tags=integration ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: server
          args: --config=../.golangci.yml
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}
          govulncheck ./...
      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@${GOSEC_VERSION}
          gosec -quiet -exclude-generated -exclude-dir=gen -exclude-dir=store ./...

  test:
    name: unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go test -race -count=1 ./...

  integration:
    name: integration tests + migrations
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: zafiro_test
          POSTGRES_USER: zafiro
          POSTGRES_PASSWORD: zafiro_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zafiro -d zafiro_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      ZAFIRO_TEST_DATABASE_URL: postgres://zafiro:zafiro_ci@localhost:5432/zafiro_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: goose up (db/migrations)
        working-directory: .
        run: |
          go install github.com/pressly/goose/v3/cmd/goose@${GOOSE_VERSION}
          goose -env=none -dir db/migrations postgres "$ZAFIRO_TEST_DATABASE_URL" up
          goose -env=none -dir db/migrations postgres "$ZAFIRO_TEST_DATABASE_URL" status
      - name: goose down-to 0 and up again (миграции обратимы)
        working-directory: .
        run: |
          goose -env=none -dir db/migrations postgres "$ZAFIRO_TEST_DATABASE_URL" down-to 0
          goose -env=none -dir db/migrations postgres "$ZAFIRO_TEST_DATABASE_URL" up
      - name: integration tests
        run: go test -race -count=1 -tags=integration ./...

  build:
    name: build binary
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: go build (без фронта — заглушка webui)
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w" -o ../bin/zafiro ./cmd/zafiro
      - name: smoke /healthz
        working-directory: .
        run: |
          ./bin/zafiro & pid=$!
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz; then break; fi
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:8080/healthz | grep -q '"status":"ok"'
          kill -TERM "$pid"
          wait "$pid"
