# Окружение нового сервера для визуального сравнения (tools/visual/new.sh): отдельный проект compose
# (zafirogo-visual), свои порты и данные в tmpfs — база разработки не затрагивается, каждый прогон с чистого листа.
# Пароли генерирует new.sh при первом запуске (~/.cache/zafirogo-visual/new/secrets.env), в репозитории их нет.
name: zafirogo-visual

services:
  postgres:
    image: mirror.gcr.io/library/postgres:18.6
    environment:
      POSTGRES_DB: zafiro_visual
      POSTGRES_USER: zafiro
      POSTGRES_PASSWORD: ${VISUAL_PG_PASSWORD:?new.sh задаёт VISUAL_PG_PASSWORD}
      ZAFIRO_DB_APP_USER: zafiro_app_login
      ZAFIRO_DB_APP_PASSWORD: ${VISUAL_APP_PASSWORD:?}
      ZAFIRO_DB_PLATFORM_USER: zafiro_platform_login
      ZAFIRO_DB_PLATFORM_PASSWORD: ${VISUAL_PLATFORM_PASSWORD:?}
      TZ: UTC
    ports:
      - "127.0.0.1:${VISUAL_PG_PORT:-55432}:5432"
    tmpfs:
      - /var/lib/postgresql
    volumes:
      - ../../db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zafiro -d zafiro_visual"]
      interval: 2s
      timeout: 3s
      retries: 30

  valkey:
    image: mirror.gcr.io/valkey/valkey:9.1.3-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no", "--requirepass", "${VISUAL_VALKEY_PASSWORD:?}"]
    environment:
      REDISCLI_AUTH: ${VISUAL_VALKEY_PASSWORD}
    ports:
      - "127.0.0.1:${VISUAL_VALKEY_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: 2s
      timeout: 3s
      retries: 30

  nats:
    image: mirror.gcr.io/library/nats:2.15.2-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "127.0.0.1:${VISUAL_NATS_PORT:-54222}:4222"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8222/healthz | grep -q ok"]
      interval: 2s
      timeout: 3s
      retries: 30
