# Исключения скана образа (trivy, .github/workflows/release.yml): сборка падает на HIGH/CRITICAL, кроме перечисленных.
#
# Правила (docs/deploy.md §10):
#   - исключение — только с обоснованием (statement): код не достижим (govulncheck это подтверждает), исправления
#     нет и риск принят, ложное срабатывание;
#   - обязательно expired_at (не дальше 90 дней): после срока скан снова падает, решение пересматривается;
#   - paths — сужать до конкретного бинарника/пакета образа, если можно.
#
# Пример:
#   vulnerabilities:
#     - id: CVE-2026-00000
#       paths: ["usr/local/bin/migrate-from-mysql"]
#       statement: "Уязвимость в драйвере MySQL при TLS-рукопожатии; инструмент переноса подключается к MySQL только из
#                   внутренней сети на время перевода клуба; govulncheck: символ не вызывается. Ревью: <ссылка на PR>"
#       expired_at: 2027-01-31
vulnerabilities: []
secrets: []
