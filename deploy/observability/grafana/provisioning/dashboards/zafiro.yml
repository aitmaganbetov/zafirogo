# Дашборды zafirogo из файлов (deploy/observability/grafana/dashboards). Правки в UI не сохраняются в файлы —
# меняйте JSON в репозитории.
apiVersion: 1
providers:
  - name: zafiro
    folder: zafirogo
    type: file
    disableDeletion: true
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
