# Staging zafirogo: два инстанса приложения из одного образа, Postgres 18.6, Valkey, NATS JetStream, job миграций,
# балансировщик nginx (HTTPS веба + L4-проброс gRPC агентов с PROXY protocol) и заглушка старого Laravel.
#
#   task staging:up       # init (пароли, PKI, TLS) → образ → compose up → миграции → ждёт /readyz обоих инстансов
#   task staging:smoke    # проверки: вход, WebSocket между инстансами, агент через L4, остановка инстанса
#   task staging:down
#
# Секреты: .env.staging (пароли для инициализации контейнеров) и secrets/ (конфигурация сервера с ключами, PKI, TLS) —
# создаёт deploy/staging/init.sh, в git не попадают. Описание — docs/deploy.md, deploy/README.md.
name: zafirogo-staging

x-app: &app
  image: ${STG_IMAGE:-zafiro:staging}
  restart: unless-stopped
  depends_on:
    migrate:
      condition: service_completed_successfully
    valkey:
      condition: service_healthy
    nats:
      condition: service_healthy
  # Бюджет graceful shutdown сервера (ZAFIRO_SHUTDOWN_TIMEOUT 30 с) + запас: docker compose stop шлёт SIGTERM и
  # ждёт, сервер отвечает 503 на /readyz, рассылает агентам Drain и дорабатывает запросы.
  stop_grace_period: 45s
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  secrets:
    - zafiro_config
    - agent_ca_cert
    - agent_ca_key
    - agent_server_cert
    - agent_server_key
  environment: &app-env
    ZAFIRO_ENV: prod
    ZAFIRO_CONFIG_FILE: /run/secrets/zafiro_config
    ZAFIRO_LOG_LEVEL: info
    ZAFIRO_SHUTDOWN_TIMEOUT: 30s
    ZAFIRO_VALKEY_ADDR: valkey:6379
    # Доверенный прокси HTTP (X-Forwarded-For) и источник PROXY protocol для gRPC — только nginx.
    ZAFIRO_HTTP_TRUSTED_PROXIES: 172.29.66.10
    ZAFIRO_AGENT_GRPC_PROXY_TRUSTED: 172.29.66.10
    ZAFIRO_AGENT_GRPC_ENDPOINT: agent.staging.zafiro.test:8443
    ZAFIRO_AGENT_PKI_CA_CERT_FILE: /run/secrets/agent_ca_cert
    ZAFIRO_AGENT_PKI_CA_KEY_FILE: /run/secrets/agent_ca_key
    ZAFIRO_AGENT_PKI_SERVER_CERT_FILE: /run/secrets/agent_server_cert
    ZAFIRO_AGENT_PKI_SERVER_KEY_FILE: /run/secrets/agent_server_key
    ZAFIRO_AGENT_GUEST_QR_BASE_URL: https://app.staging.zafiro.test
    ZAFIRO_SUPERADMIN_DOMAIN: superadmin.staging.zafiro.test
    ZAFIRO_HTTP_WIKI_HOST: wiki.staging.zafiro.test
    # Мобильные запросы и ключи /api/v1 клубов, которых здесь нет, — в старый Laravel (docs/mobile-compat.md §3,
    # S6-O1-4; integrations.legacy_upstream не задан — берётся mobile.upstream).
    ZAFIRO_MOBILE_UPSTREAM: http://legacy:80
    ZAFIRO_MOBILE_UPSTREAM_HOST: staging.zafiro.test
    # Метрики Prometheus — отдельный внутренний порт (O3, docs/observability.md); наружу не публикуется.
    ZAFIRO_OBSERVABILITY_METRICS_LISTEN: ":9090"
  networks:
    zafiro: {}

services:
  postgres:
    image: ${STG_POSTGRES_IMAGE:-postgres:18.6@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${STG_POSTGRES_DB:-zafiro}
      POSTGRES_USER: ${STG_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${STG_POSTGRES_PASSWORD:?запустите deploy/staging/init.sh}
      ZAFIRO_DB_OWNER_USER: ${STG_DB_OWNER_USER:-zafiro_owner}
      ZAFIRO_DB_OWNER_PASSWORD: ${STG_DB_OWNER_PASSWORD:?}
      ZAFIRO_DB_APP_USER: ${STG_DB_APP_USER:-zafiro_app_login}
      ZAFIRO_DB_APP_PASSWORD: ${STG_DB_APP_PASSWORD:?}
      ZAFIRO_DB_PLATFORM_USER: ${STG_DB_PLATFORM_USER:-zafiro_platform_login}
      ZAFIRO_DB_PLATFORM_PASSWORD: ${STG_DB_PLATFORM_PASSWORD:?}
      TZ: UTC
    command: ["postgres", "-c", "max_connections=300", "-c", "shared_buffers=256MB"]
    # Только для проверок с хоста (task staging:seed, staging:smoke); на реальном staging-сервере — без публикации.
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ../../db/init/10-zafiro-logins.sh:/docker-entrypoint-initdb.d/10-zafiro-logins.sh:ro
      - ./postgres-init/20-zafiro-owner.sh:/docker-entrypoint-initdb.d/20-zafiro-owner.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    networks:
      zafiro: {}

  valkey:
    image: ${STG_VALKEY_IMAGE:-valkey/valkey:9.1.3-alpine@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b}
    restart: unless-stopped
    # Сессии, лимиты, присутствие ПК: AOF — переживает перезапуск (потеря не теряет денег, docs/deploy.md §8).
    command: ["valkey-server", "--appendonly", "yes", "--requirepass", "${STG_VALKEY_PASSWORD:?}", "--maxmemory-policy", "noeviction"]
    environment:
      REDISCLI_AUTH: ${STG_VALKEY_PASSWORD}
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      zafiro: {}

  nats:
    image: ${STG_NATS_IMAGE:-nats:2.15.2-alpine@sha256:823e7f1d6d8ffe3b30dbd73d4a06bbb939acf94929f7fdf224404da7a05bafb5}
    restart: unless-stopped
    # Одиночный сервер JetStream (staging). Прод — кластер из 3 (docs/deploy.md §7, events.stream.replicas=3).
    command: ["-js", "-sd", "/data", "-m", "8222", "--user", "zafiro", "--pass", "${STG_NATS_PASSWORD:?}"]
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8222/healthz?js-enabled-only=true | grep -q ok"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      zafiro: {}

  # Job миграций: goose под владельцем схемы (PD-9), не под логинами приложения. Завершается — стартуют инстансы.
  migrate:
    image: ${STG_IMAGE:-zafiro:staging}
    entrypoint: ["/usr/local/bin/goose"]
    command: ["up"]
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      GOOSE_DBSTRING: postgres://${STG_DB_OWNER_USER:-zafiro_owner}:${STG_DB_OWNER_PASSWORD:?}@postgres:5432/${STG_POSTGRES_DB:-zafiro}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      zafiro: {}

  app1:
    <<: *app
    hostname: app1
    environment:
      <<: *app-env
      ZAFIRO_AGENT_INSTANCE_ID: app1
    # Прямой доступ к инстансу — только для проверок (/readyz, WebSocket на конкретный инстанс).
    ports:
      - "127.0.0.1:18081:8080"

  app2:
    <<: *app
    hostname: app2
    environment:
      <<: *app-env
      ZAFIRO_AGENT_INSTANCE_ID: app2
    ports:
      - "127.0.0.1:18082:8080"

  legacy:
    image: ${STG_NGINX_IMAGE:-nginx:1.30.5-alpine3.24@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94}
    restart: unless-stopped
    volumes:
      - ./legacy/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      zafiro: {}

  lb:
    image: ${STG_NGINX_IMAGE:-nginx:1.30.5-alpine3.24@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94}
    restart: unless-stopped
    depends_on: [app1, app2, legacy]
    ports:
      - "${STG_BIND:-127.0.0.1}:${STG_HTTP_PORT:-80}:80"
      - "${STG_BIND:-127.0.0.1}:${STG_HTTPS_PORT:-443}:443"
      - "${STG_BIND:-127.0.0.1}:${STG_AGENT_PORT:-8443}:8443"
    secrets:
      - web_tls_cert
      - web_tls_key
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/http.d:/etc/nginx/http.d:ro
      - ./nginx/stream.d:/etc/nginx/stream.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
    tmpfs:
      - /tmp
    # Прод: лимит дескрипторов ≥ 2 × соединений агентов на балансировщик (ulimits: nofile: 131072 или LimitNOFILE
    # systemd); здесь не задан — в непривилегированных средах Docker поднять его нельзя (worker_rlimit_nofile тогда
    # пишет предупреждение в лог).
    healthcheck:
      test: ["CMD-SHELL", "nginx -t -q"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      zafiro:
        # Фиксированный адрес: его и только его сервер считает доверенным прокси (HTTP и PROXY protocol).
        ipv4_address: 172.29.66.10

secrets:
  zafiro_config:
    file: ./secrets/zafiro.yaml
  agent_ca_cert:
    file: ./secrets/pki/agent-ca.pem
  agent_ca_key:
    file: ./secrets/pki/agent-ca.key
  agent_server_cert:
    file: ./secrets/pki/server.pem
  agent_server_key:
    file: ./secrets/pki/server.key
  web_tls_cert:
    file: ./secrets/web/tls.pem
  web_tls_key:
    file: ./secrets/web/tls.key

networks:
  zafiro:
    ipam:
      config:
        - subnet: 172.29.66.0/24

volumes:
  postgres-data:
  valkey-data:
  nats-data:
