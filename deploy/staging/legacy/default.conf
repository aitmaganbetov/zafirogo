# Заглушка старого Laravel на staging: отвечает, кто обслужил запрос (проверка маршрутизации балансировщика и
# mobile.upstream). В проде вместо неё — адрес старого сервера.
server {
    listen 80 default_server;
    server_name _;
    default_type text/plain;
    add_header X-Zafiro-Upstream laravel always;
    location / {
        return 200 "laravel $request_method $request_uri\n";
    }
}
