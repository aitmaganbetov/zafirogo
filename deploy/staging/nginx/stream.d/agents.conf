# gRPC агентов: L4-проброс без расшифровки. mTLS заканчивается в zafiro (сервер должен видеть клиентский
# сертификат ПК), поэтому TLS здесь не терминируется. Адрес ПК передаётся заголовком PROXY protocol v1
# (nginx stream умеет только v1; HAProxy/облачные NLB — v2, сервер понимает оба): agent.grpc.proxy_trusted сервера —
# адрес этого nginx. Без заголовка лимиты регистрации по IP и подсети ключа образа (Q-037) видели бы адрес nginx.

resolver 127.0.0.11 valid=10s ipv6=off;

upstream zafiro_agents {
    zone zafiro_agents 64k;
    # Соединения агентов долгие: least_conn выравнивает их по инстансам после перезапуска одного из них
    # (сервер сам перебалансирует командой Drain при плановой остановке).
    least_conn;
    server app1:8443 resolve max_fails=1 fail_timeout=10s;
    server app2:8443 resolve max_fails=1 fail_timeout=10s;
}

server {
    listen 8443;
    proxy_pass zafiro_agents;
    proxy_protocol on;
    proxy_connect_timeout 3s;
    # Агент пингует раз в 30 с, сервер — после 60 с тишины: простой > 5 мин означает мёртвое соединение.
    proxy_timeout 5m;
    # Инстанс недоступен (остановлен) — следующий.
    proxy_next_upstream on;
    proxy_next_upstream_tries 2;
    proxy_next_upstream_timeout 5s;
}
