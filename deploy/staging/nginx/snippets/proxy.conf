# Заголовки к upstream. nginx — первый узел: X-Forwarded-For ЗАМЕНЯЕТСЯ адресом клиента (не дописывается),
# чтобы клиент не подставил чужой IP; сервер доверяет заголовку только от nginx (http.trusted_proxies).
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto https;
# Upgrade только для WebSocket (map $connection_upgrade); у остальных пусто — keepalive к upstream.
proxy_set_header Connection $connection_upgrade;
# Соединение внутри сети — доли миллисекунды; остановленный инстанс (адрес ещё в кэше DNS ≤ 10 с) не держит запрос
# дольше секунды — сразу следующий upstream (S6-O4-2, docs/load-test.md).
proxy_connect_timeout 1s;
# Повтор на другом инстансе — только если запрос не ушёл (ошибка соединения) или ответ 502/503/504 у
# идемпотентного метода; POST с деньгами nginx не повторяет (нет non_idempotent) — повтор делает клиент
# с тем же ключом идемпотентности.
proxy_next_upstream error timeout http_502 http_503 http_504;
proxy_next_upstream_tries 2;
proxy_next_upstream_timeout 10s;
# Загрузки (логотипы, картинки входа и новостей — до 3 МБ; импорт) с запасом.
client_max_body_size 10m;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
