# Балансировщик staging (docs/deploy.md §2):
#   http   — TLS веба/REST/WebSocket заканчивается здесь (HSTS — здесь, http.trusted_proxies сервера = адрес nginx);
#   stream — gRPC агентов: L4-проброс TCP без расшифровки (mTLS заканчивается в zafiro), адрес ПК — PROXY protocol v1
#            (agent.grpc.proxy_trusted сервера = адрес nginx).
worker_processes auto;
worker_rlimit_nofile 65535;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    # 50 000 ПК на кластер (docs/agent-protocol.md §13): каждое соединение агента — 2 дескриптора на балансировщике.
    worker_connections 32768;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log /dev/stdout;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    include /etc/nginx/http.d/*.conf;
}

stream {
    include /etc/nginx/stream.d/*.conf;
}
