# Балансировщик staging (docs/deploy.md §2):
#   http   — TLS веба/REST/WebSocket заканчивается здесь (HSTS — здесь, http.trusted_proxies сервера = адрес nginx);
#   stream — gRPC агентов: L4-проброс TCP без расшифровки (mTLS заканчивается в zafiro), адрес ПК — PROXY protocol v1
#            (agent.grpc.proxy_trusted сервера = адрес nginx).
worker_processes auto;
worker_rlimit_nofile 65535;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    # 50 000 ПК на кластер (docs/agent-protocol.md §13): каждое соединение агента — 2 дескриптора на балансировщике.
    worker_connections 32768;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    # Журнал доступа без секретов (аудит A-05). В журнал НЕ попадают:
    #   строка запроса целиком — /ws?ticket=<одноразовый билет WebSocket> и любые другие параметры;
    #   секретный сегмент пути — токен приглашения сотрудника (/invitations/<токен>, /api/invitations/<токен>[/accept])
    #   и код входа на ПК по QR (/pc-login/<код>, /api/pc-login/<код>; мобильное приложение —
    #   /api/guest/qr-login/<код>): вместо него «***» (то же делает сервер: server/internal/http/logpath.go);
    #   Referer — страница /invitations/<токен> шлёт его с тем же токеном в запросах к API.
    # Новый маршрут с секретом в пути — добавить сюда и в проверку deploy/staging/nginx-test.sh.
    # error_log (уровень warn) строку запроса печатает как есть — его не отправлять во внешние системы без фильтра.
    map $request_uri $log_uri {
        "~^(?<log_prefix>/(?:api/)?(?:invitations|pc-login|guest/qr-login)/)[^/?]+(?<log_rest>/[^?]*)?"  "$log_prefix***$log_rest";
        "~^(?<log_path>[^?]*)"                                                            $log_path;
        default                                                                           "-";
    }
    log_format zafiro '$remote_addr [$time_iso8601] $host "$request_method $log_uri $server_protocol" '
                      '$status $body_bytes_sent rt=$request_time up=$upstream_addr urt=$upstream_response_time '
                      '"$http_user_agent"';
    access_log /dev/stdout zafiro;

    # Сжатие ответов (аудит PB-11). Accept-Encoding клиента уходит в upstream как есть: ответ, который сервер сжал
    # сам (есть Content-Encoding), nginx передаёт без изменений — дважды не сжимается; несжатый текстовый ответ
    # (JSON API, JS/CSS/HTML вшитого фронта, ответы старого Laravel) сжимает nginx.
    #   gzip_proxied any — запросы приходят через прокси/CDN (заголовок Via) тоже сжимаются;
    #   gzip_vary        — Vary: Accept-Encoding, чтобы промежуточный кэш не отдал gzip клиенту без его поддержки;
    #   gzip_min_length  — по Content-Length; мелкие ответы не сжимаются (выигрыша нет).
    # text/html сжимается всегда; шрифты woff2 и картинки уже сжаты — их в списке нет. /ws (101 Upgrade) не затрагивается.
    # gzip_static не включён: статику отдаёт zafiro из embed.FS, файлов на диске балансировщика нет.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/json application/problem+json application/javascript text/javascript text/css
               text/plain text/xml application/xml image/svg+xml application/manifest+json;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    include /etc/nginx/http.d/*.conf;
}

stream {
    include /etc/nginx/stream.d/*.conf;
}
