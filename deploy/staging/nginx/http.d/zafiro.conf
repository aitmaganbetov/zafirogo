# HTTP(S): домены и маршрутизация переходного периода (docs/deploy.md §3, docs/mobile-compat.md §3,
# tools/migrate-from-mysql/README.md «Порядок перевода клуба»). Домен staging — staging.zafiro.test
# (в проде — zafiro.kz; заменить во всех файлах deploy/staging/nginx).
#
#   app.staging.zafiro.test         — панель клуба zafirogo (клубы, уже переведённые; по общему адресу балансировщик
#                                     не знает клуба сотрудника до входа)
#   superadmin.staging.zafiro.test  — кабинет суперадмина (superadmin.domain)
#   wiki.staging.zafiro.test        — wiki (http.wiki_host)
#   staging.zafiro.test             — старый Laravel, кроме:
#       /api/(auth|guest|staff)/    — мобильные приложения → zafirogo (чужие токены он сам проксирует в Laravel)
#       /api/v1/                    — интеграции: по префиксу API-ключа (карта maps/api-v1-clubs.map)

resolver 127.0.0.11 valid=10s ipv6=off;   # DNS docker: адреса инстансов после перезапуска

# Дольше, чем http.request_timeout сервера (30 с): обрыв отдаёт сервер, а не балансировщик (/ws — свой таймаут).
proxy_read_timeout 65s;
proxy_send_timeout 65s;

upstream zafirogo {
    zone zafirogo 64k;
    # Пассивная проверка: после ошибки инстанс выводится на 10 с. Инстанс при остановке сам отвечает 503 на /readyz,
    # закрывает listener и дорабатывает начатые запросы (graceful shutdown, ZAFIRO_SHUTDOWN_TIMEOUT).
    server app1:8080 resolve max_fails=1 fail_timeout=10s;
    server app2:8080 resolve max_fails=1 fail_timeout=10s;
    keepalive 64;
}

upstream laravel {
    zone laravel 64k;
    server legacy:80 resolve;   # staging: заглушка старого Laravel (deploy/staging/legacy)
    keepalive 16;
}

# WebSocket: Upgrade только когда клиент его просит; иначе keepalive к upstream.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# /api/v1: какие клубы на каком сервере — по префиксу ключа (X-Api-Key или Authorization: Bearer).
map "$http_x_api_key $http_authorization" $zafiro_v1 {
    default laravel;
    include /etc/nginx/maps/api-v1-clubs.map;
}

server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

# Неизвестный хост по HTTPS — отказ (не отдаём панель на чужих именах).
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

server {
    listen 443 ssl;
    http2 on;
    server_name app.staging.zafiro.test superadmin.staging.zafiro.test wiki.staging.zafiro.test;
    include /etc/nginx/snippets/tls.conf;

    location = /metrics { return 404; }   # метрики — только из внутренней сети (docs/deploy.md)

    location = /ws {
        include /etc/nginx/snippets/proxy.conf;
        proxy_set_header Upgrade $http_upgrade;
        # Сервер шлёт ping каждые 25 с (realtime.ping_interval) — соединение не простаивает.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_pass http://zafirogo;
    }

    location / {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://zafirogo;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name staging.zafiro.test;
    include /etc/nginx/snippets/tls.conf;

    location = /metrics { return 404; }

    # Мобильные приложения (Flutter) — всегда в zafirogo: клуб на новом сервере — ответ там, иначе zafirogo
    # проксирует запрос в Laravel (mobile.upstream). docs/mobile-compat.md §3.
    location ~ ^/api/(auth|guest|staff)/ {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://zafirogo;
    }

    # Интеграции: переведённые клубы — по карте ключей.
    location /api/v1/ {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://$zafiro_v1;
    }

    # Всё остальное — старый Laravel, пока все клубы не переведены.
    location / {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://laravel;
    }
}
