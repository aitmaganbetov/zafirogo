# HTTP(S): домены и маршрутизация переходного периода (docs/deploy.md §3, docs/mobile-compat.md §3,
# tools/migrate-from-mysql/README.md «Порядок перевода клуба»). Домен staging — staging.zafiro.test
# (в проде — zafiro.kz; заменить во всех файлах deploy/staging/nginx).
#
#   app.staging.zafiro.test         — панель клуба zafirogo (клубы, уже переведённые; по общему адресу балансировщик
#                                     не знает клуба сотрудника до входа)
#   superadmin.staging.zafiro.test  — кабинет суперадмина (superadmin.domain)
#   wiki.staging.zafiro.test        — wiki (http.wiki_host)
#   resseler.staging.zafiro.test    — кабинет реселлера (reseller.domain; написание — как в старом проекте, UQ-21)
#   staging.zafiro.test             — старый Laravel, кроме:
#       /api/(auth|guest|staff)/    — мобильные приложения → zafirogo (чужие токены он сам проксирует в Laravel)
#       /api/v1/                    — интеграции → zafirogo (ключи, которых нет в его базе, он сам проксирует в
#                                     Laravel: integrations.legacy_upstream / mobile.upstream, S6-O1-4)

resolver 127.0.0.11 valid=10s ipv6=off;   # DNS docker: адреса инстансов после перезапуска

# Дольше, чем http.request_timeout сервера (30 с): обрыв отдаёт сервер, а не балансировщик (/ws — свой таймаут).
proxy_read_timeout 65s;
proxy_send_timeout 65s;

upstream zafirogo {
    zone zafirogo 64k;
    # Пассивная проверка: после ошибки инстанс выводится на 10 с. Инстанс при остановке сам отвечает 503 на /readyz,
    # закрывает listener и дорабатывает начатые запросы (graceful shutdown, ZAFIRO_SHUTDOWN_TIMEOUT).
    server app1:8080 resolve max_fails=1 fail_timeout=10s;
    server app2:8080 resolve max_fails=1 fail_timeout=10s;
    keepalive 64;
}

upstream laravel {
    zone laravel 64k;
    server legacy:80 resolve;   # staging: заглушка старого Laravel (deploy/staging/legacy)
    keepalive 16;
}

# WebSocket: Upgrade только когда клиент его просит; иначе keepalive к upstream.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80 default_server;
    server_name _;

    # Проверка самого балансировщика (healthcheck compose: обслуживает ли nginx запросы, аудит OPS-15) — только с
    # 127.0.0.1. stub_status, а не return: return срабатывает до allow/deny.
    location = /nginx-health {
        access_log off;
        allow 127.0.0.1;
        deny all;
        stub_status;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Неизвестный хост по HTTPS — отказ (не отдаём панель на чужих именах).
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

server {
    listen 443 ssl;
    http2 on;
    server_name app.staging.zafiro.test superadmin.staging.zafiro.test wiki.staging.zafiro.test resseler.staging.zafiro.test;
    include /etc/nginx/snippets/tls.conf;
    # Загрузки (логотипы, картинки входа и новостей — до 3 МБ; импорт) с запасом.
    client_max_body_size 10m;

    location = /metrics { return 404; }   # метрики — только из внутренней сети (docs/deploy.md)
    # Проверки оркестратора — напрямую на :8080 инстанса, не через балансировщик (аудит OPS-13): /readyz раскрывает
    # состав зависимостей и на каждый запрос ходит в Postgres/Valkey/NATS.
    location = /healthz { return 404; }
    location = /readyz { return 404; }

    location = /ws {
        include /etc/nginx/snippets/proxy.conf;
        proxy_set_header Upgrade $http_upgrade;
        # Сервер шлёт ping каждые 25 с (realtime.ping_interval) — соединение не простаивает.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_pass http://zafirogo;
    }

    # Фото клуба для гостевого приложения: до 10 файлов по 3 МБ одной формой (http.MaxPhotosBody = 32 МБ);
    # остальные загрузки — общий предел snippets/proxy.conf.
    location = /api/settings/profile/photos {
        include /etc/nginx/snippets/proxy.conf;
        client_max_body_size 32m;
        proxy_pass http://zafirogo;
    }

    location / {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://zafirogo;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name staging.zafiro.test;
    include /etc/nginx/snippets/tls.conf;
    client_max_body_size 10m;

    location = /metrics { return 404; }

    # Мобильные приложения (Flutter) и интеграции /api/v1 — всегда в zafirogo: токен или ключ клуба на новом
    # сервере — ответ там, иначе zafirogo сам проксирует запрос в Laravel (mobile.upstream,
    # integrations.legacy_upstream). docs/mobile-compat.md §3, tools/migrate-from-mysql/README.md.
    # /api/catalog/ — каталог клубов гостевого приложения (до входа): zafirogo объединяет свои клубы со списком
    # Laravel (docs/mobile-compat.md §3.5). Фото и логотипы клубов нового сервера — по адресу панели
    # (agent.guest.public_base_url), клубов Laravel — по этому домену (location / ниже).
    location ~ ^/api/(auth|guest|staff|v1|catalog)/ {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://zafirogo;
    }

    # Всё остальное — старый Laravel, пока все клубы не переведены.
    location / {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://laravel;
    }
}
