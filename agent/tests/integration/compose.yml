# Окружение Go-сервера для интеграционных тестов агента (agent/tests/integration/server.sh): отдельный проект compose
# (zafirogo-agent-it), свои порты, данные в tmpfs — база разработки и стенд визуального сравнения не затрагиваются.
# Пароли генерирует server.sh при первом запуске, в репозитории их нет.
name: zafirogo-agent-it

services:
  postgres:
    image: mirror.gcr.io/library/postgres:18.6
    environment:
      POSTGRES_DB: zafiro_agent_it
      POSTGRES_USER: zafiro
      POSTGRES_PASSWORD: ${AGENT_IT_PG_PASSWORD:?server.sh задаёт AGENT_IT_PG_PASSWORD}
      ZAFIRO_DB_APP_USER: zafiro_app_login
      ZAFIRO_DB_APP_PASSWORD: ${AGENT_IT_APP_PASSWORD:?}
      ZAFIRO_DB_PLATFORM_USER: zafiro_platform_login
      ZAFIRO_DB_PLATFORM_PASSWORD: ${AGENT_IT_PLATFORM_PASSWORD:?}
      TZ: UTC
    ports:
      - "127.0.0.1:${AGENT_IT_PG_PORT:-55532}:5432"
    tmpfs:
      - /var/lib/postgresql
    volumes:
      - ../../../db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zafiro -d zafiro_agent_it"]
      interval: 2s
      timeout: 3s
      retries: 30

  valkey:
    image: mirror.gcr.io/valkey/valkey:9.1.3-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no", "--requirepass", "${AGENT_IT_VALKEY_PASSWORD:?}"]
    environment:
      REDISCLI_AUTH: ${AGENT_IT_VALKEY_PASSWORD}
    ports:
      - "127.0.0.1:${AGENT_IT_VALKEY_PORT:-56479}:6379"
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: 2s
      timeout: 3s
      retries: 30

  nats:
    image: mirror.gcr.io/library/nats:2.15.2-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "127.0.0.1:${AGENT_IT_NATS_PORT:-54322}:4222"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8222/healthz | grep -q ok"]
      interval: 2s
      timeout: 3s
      retries: 30
