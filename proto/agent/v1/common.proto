// Общие типы контракта агента ПК Zafiro (пакет zafiro.agent.v1).
//
// Правила всего контракта (идемпотентность, повторная доставка, коды ошибок, лимиты)
// описаны в шапке agent.proto и в docs/agent-protocol.md.
//
// Деньги во всём контракте — int64 в тиынах (1 тенге = 100 тиынов), поле с суффиксом
// `_tiyn`. Никаких float/double и строковых сумм (в старом API суммы приходили строками
// "1234.50" — см. AgentTariffPurchaseService::formatCents в Laravel).
// Время — google.protobuf.Timestamp (UTC), длительности — google.protobuf.Duration.
syntax = "proto3";

package zafiro.agent.v1;

option csharp_namespace = "Zafiro.Agent.V1";
option go_package = "github.com/aitmaganbetov/zafirogo/server/gen/agent/v1;agentv1";

import "google/protobuf/timestamp.proto";

// Машиночитаемый код ошибки.
//
// Как передаётся:
// * unary-RPC: gRPC-статус (google.rpc.Status) с деталью google.rpc.ErrorInfo, где
//   ErrorInfo.reason = имя значения этого enum (например "ERROR_CODE_INSUFFICIENT_FUNDS"),
//   ErrorInfo.domain = "agent.zafiro.kz", ErrorInfo.metadata — параметры (например
//   "retry_after_seconds", "field"). Для ошибок валидации полей дополнительно
//   google.rpc.BadRequest (field_violations), для лимитов — google.rpc.RetryInfo.
//   Текст для человека — google.rpc.LocalizedMessage на языке ПК (заголовок
//   `zafiro-locale`), его агент показывает как есть.
// * в стриме Connect: поле error_code в CommandResult / AgentError.
//
// Соответствие gRPC-кодам приведено у каждого значения. Агент решает, что делать, по
// ErrorCode, а не по тексту. Новые значения добавляются только в конец; неизвестное
// значение агент трактует как ERROR_CODE_INTERNAL.
enum ErrorCode {
  // Не задан. Сервер никогда не отправляет.
  ERROR_CODE_UNSPECIFIED = 0;

  // --- Протокол и транспорт ---

  // Внутренняя ошибка сервера (INTERNAL). Повтор с backoff.
  ERROR_CODE_INTERNAL = 1;
  // Версия протокола агента не поддерживается (FAILED_PRECONDITION). Агент ждёт
  // UpdateAvailable или обновляется установщиком; reconnect не чаще раза в 10 минут.
  ERROR_CODE_PROTOCOL_VERSION_UNSUPPORTED = 2;
  // Ошибка валидации полей (INVALID_ARGUMENT) + google.rpc.BadRequest.
  // Старый аналог: HTTP 422 с errors{field: [..]}.
  ERROR_CODE_VALIDATION_FAILED = 3;
  // Слишком много запросов (RESOURCE_EXHAUSTED) + google.rpc.RetryInfo.
  // Старый аналог: HTTP 429 от throttle:* (лимиты — docs/parts/20-api.md).
  ERROR_CODE_RATE_LIMITED = 4;
  // Тот же idempotency_key пришёл с другим содержимым запроса (FAILED_PRECONDITION).
  // Старый аналог в /api/v1: idempotency_key_reused (app/Http/Middleware/Api/ApiIdempotency.php).
  ERROR_CODE_IDEMPOTENCY_KEY_REUSED = 5;
  // Запрос с этим idempotency_key ещё выполняется (ABORTED). Повторить позже тем же ключом.
  ERROR_CODE_IDEMPOTENCY_IN_PROGRESS = 6;
  // Обязательный idempotency_key не передан или не UUID (INVALID_ARGUMENT).
  ERROR_CODE_IDEMPOTENCY_KEY_REQUIRED = 7;

  // --- Регистрация ПК и сертификат ---

  // Одноразовый код регистрации неверен (UNAUTHENTICATED).
  // Старый аналог: invalid_club_key (AgentEnrollController).
  ERROR_CODE_ENROLLMENT_CODE_INVALID = 20;
  // Код регистрации истёк или уже использован (UNAUTHENTICATED).
  ERROR_CODE_ENROLLMENT_CODE_EXPIRED = 21;
  // CSR не прошёл проверку: не тот алгоритм/размер ключа, нет подписи (INVALID_ARGUMENT).
  ERROR_CODE_CSR_INVALID = 22;
  // Клиентский сертификат отозван (UNAUTHENTICATED). Агент удаляет ключ и сертификат
  // и переходит в режим «ПК не подключён» (нужен новый код регистрации).
  ERROR_CODE_CERTIFICATE_REVOKED = 23;
  // Сертификат истёк (UNAUTHENTICATED). Продлить уже нельзя — нужна новая регистрация.
  ERROR_CODE_CERTIFICATE_EXPIRED = 24;
  // Железо ПК не совпадает с тем, на который выдан сертификат (PERMISSION_DENIED).
  // Старый аналог: device_mismatch (app/Http/Middleware/AuthenticateAgentDevice.php).
  ERROR_CODE_DEVICE_MISMATCH = 25;
  // В тарифе SaaS клуба нет места для ещё одного ПК (FAILED_PRECONDITION).
  // Старый аналог: computer_not_added (AgentEnrollController).
  ERROR_CODE_COMPUTER_LIMIT_REACHED = 26;
  // Карточка ПК удалена в панели клуба (NOT_FOUND).
  // Старый аналог: computer_not_found (ClubComputerController::resolve).
  ERROR_CODE_COMPUTER_NOT_FOUND = 27;
  // Подписка клуба неактивна (FAILED_PRECONDITION). Старый аналог: HTTP 402
  // (app/Http/Middleware/RequireActiveSubscription.php, AuthenticateAgentDevice).
  ERROR_CODE_SUBSCRIPTION_INACTIVE = 28;
  // Бездисковый ПК с новым MAC зарегистрирован по ключу образа и ждёт подтверждения сотрудником
  // в панели клуба (FAILED_PRECONDITION) + google.rpc.RetryInfo. Агент повторяет Enroll через
  // retry_delay (решение Q-037).
  ERROR_CODE_PENDING_APPROVAL = 29;
  // Защищённый метод вызван без клиентского сертификата (UNAUTHENTICATED): ПК не зарегистрирован —
  // агент идёт в Enroll. В отличие от CERTIFICATE_REVOKED ключ не удаляется
  // (docs/open-questions/stage2-agent-enroll.md §4).
  ERROR_CODE_CERTIFICATE_REQUIRED = 30;

  // --- Вход гостя ---

  // Неверный телефон или пароль (UNAUTHENTICATED). Старый аналог: HTTP 401 из
  // AuthController::issueUserLoginResponse.
  ERROR_CODE_INVALID_CREDENTIALS = 40;
  // Аккаунт заблокирован (PERMISSION_DENIED). Старый аналог: account_blocked.
  ERROR_CODE_ACCOUNT_BLOCKED = 41;
  // Аккаунт не клиент этого клуба (PERMISSION_DENIED). Старый аналог: not_club_member.
  ERROR_CODE_NOT_CLUB_MEMBER = 42;
  // Клиент уже вошёл на другом ПК (FAILED_PRECONDITION). Старый аналог: signed_in_elsewhere
  // (HTTP 409, app/Services/AgentSignIns.php).
  ERROR_CODE_SIGNED_IN_ELSEWHERE = 43;
  // Токен гостя отсутствует, истёк, отозван или выдан другому ПК (UNAUTHENTICATED).
  // Агент выполняет выход гостя.
  ERROR_CODE_GUEST_TOKEN_INVALID = 44;
  // Телефон уже клиент этого клуба — нужно войти, а не регистрироваться (ALREADY_EXISTS).
  // Старый аналог: 422 phone «Вы уже клиент этого клуба» (AgentRegisterController).
  ERROR_CODE_ALREADY_CLUB_MEMBER = 45;
  // Пароль (текущий / от аккаунта) неверен (PERMISSION_DENIED). Используется при
  // регистрации существующего номера, смене пароля, переводе баланса.
  ERROR_CODE_WRONG_PASSWORD = 46;
  // Код подтверждения (Telegram) неверен (INVALID_ARGUMENT).
  ERROR_CODE_CONFIRMATION_CODE_INVALID = 47;
  // Код подтверждения истёк или исчерпаны попытки (FAILED_PRECONDITION).
  ERROR_CODE_CONFIRMATION_CODE_EXPIRED = 48;
  // QR-вход истёк или уже использован (NOT_FOUND). Старый аналог: qr_expired / status=expired.
  ERROR_CODE_QR_LOGIN_EXPIRED = 49;

  // --- PIN сотрудника ---

  // PIN выхода не задан в настройках клуба (FAILED_PRECONDITION). Старый аналог: pin_not_configured.
  ERROR_CODE_PIN_NOT_CONFIGURED = 60;
  // Неверный PIN (PERMISSION_DENIED). Старый аналог: invalid_pin.
  ERROR_CODE_INVALID_PIN = 61;

  // --- Бизнес-ошибки гостя ---

  // Функция выключена в настройках клуба «Гости» (PERMISSION_DENIED).
  // Старые аналоги: qr_disabled, shop_disabled, GuestFeatures::ensure().
  ERROR_CODE_FEATURE_DISABLED = 80;
  // Недостаточно средств на балансе (FAILED_PRECONDITION).
  ERROR_CODE_INSUFFICIENT_FUNDS = 81;
  // Тариф не продаётся на этом ПК сейчас: другая зона, период, лимит покупок, удалён
  // (FAILED_PRECONDITION).
  ERROR_CODE_TARIFF_UNAVAILABLE = 82;
  // Сессия не найдена или уже другая (FAILED_PRECONDITION). Старый аналог: HTTP 422 в heartbeat
  // и session/end, когда session_id не совпадает.
  ERROR_CODE_SESSION_MISMATCH = 83;
  // На ПК нет активной сессии (FAILED_PRECONDITION).
  ERROR_CODE_NO_ACTIVE_SESSION = 84;
  // Пакет времени не найден или истёк (NOT_FOUND).
  ERROR_CODE_PACKAGE_UNAVAILABLE = 85;
  // Товара нет в нужном количестве (FAILED_PRECONDITION).
  ERROR_CODE_OUT_OF_STOCK = 86;
  // Целевой ПК для пересадки занят, выключен или в другой недоступной зоне (FAILED_PRECONDITION).
  ERROR_CODE_SEAT_UNAVAILABLE = 87;
  // Дружба не найдена или не принадлежит гостю (NOT_FOUND).
  ERROR_CODE_FRIENDSHIP_NOT_FOUND = 88;
  // Сумма перевода вне лимитов (INVALID_ARGUMENT). Старый лимит: Friends::MAX_TRANSFER_CENTS.
  ERROR_CODE_TRANSFER_LIMIT = 89;
  // Пользователь с таким телефоном не найден (NOT_FOUND) — заявка в друзья.
  ERROR_CODE_USER_NOT_FOUND = 90;
  // ПК забронирован другим клиентом на время покупаемой сессии (FAILED_PRECONDITION).
  // Старый аналог: ComputerReservations::blocking() в AgentTariffPurchaseService (~строка 276),
  // SeatTransfers, GuestSessions. Метаданные ErrorInfo: "reserved_from" (RFC 3339).
  ERROR_CODE_COMPUTER_RESERVED = 91;

  // --- Команды стрима (только в CommandResult) ---

  // Команда пришла после expires_at — не выполнена.
  ERROR_CODE_COMMAND_EXPIRED = 100;
  // Агент не умеет эту команду (старая версия агента).
  ERROR_CODE_COMMAND_UNSUPPORTED = 101;
  // Команда не может быть выполнена в текущем состоянии ПК (например, Unlock без сессии).
  ERROR_CODE_COMMAND_REJECTED = 102;
  // Обновление: подпись Ed25519 или sha256 не сошлись — установщик удалён, не запущен.
  ERROR_CODE_UPDATE_VERIFICATION_FAILED = 103;
}

// Состояние агента на ПК (то, что агент сообщает в Status).
// Старые значения: ClubComputer::AGENT_STATES = idle, in_session, locked, shutting_down
// (app/Models/ClubComputer.php) и WindowsAgent/ZafiroAgent/Models/ComputerState.cs.
enum ComputerState {
  // Не задано.
  COMPUTER_STATE_UNSPECIFIED = 0;
  // Экран входа, никто не вошёл.
  COMPUTER_STATE_IDLE = 1;
  // Гость вошёл, оплаченной сессии нет (выбор тарифа, автобиллинг на паузе).
  COMPUTER_STATE_LOCKED = 2;
  // Идёт оплаченная сессия.
  COMPUTER_STATE_IN_SESSION = 3;
  // ПК выключается или перезагружается.
  COMPUTER_STATE_SHUTTING_DOWN = 4;
  // Техрежим сотрудника (после PIN или команды EnterServiceMode): агент закрыт на время.
  COMPUTER_STATE_SERVICE = 5;
}

// С какого баланса платить. Старое поле `balance` = main | bonus
// (AgentTariffPurchaseService::BALANCES); не задано — правила клуба (PaymentRules).
enum BalanceSource {
  // По правилам клуба (смешанная оплата, если разрешена).
  BALANCE_SOURCE_UNSPECIFIED = 0;
  // Только основной баланс.
  BALANCE_SOURCE_MAIN = 1;
  // Бонусами (в пределах bonus_max_percent), остаток — основным, если разрешена смешанная оплата.
  BALANCE_SOURCE_BONUS = 2;
}

// Балансы гостя в клубе. Старые поля balance / bonus_balance (member_balances).
message Balance {
  // Основной баланс, тиыны.
  int64 main_tiyn = 1;
  // Бонусный баланс, тиыны.
  int64 bonus_tiyn = 2;
  // Код валюты клуба (ISO 4217), настройка finances.currency, по умолчанию "KZT".
  string currency = 3;
}

// Краткие данные гостя (пользователя-клиента клуба).
message GuestUser {
  // ID пользователя (users.id).
  int64 user_id = 1;
  // Отображаемое имя.
  string name = 2;
  // Телефон в маске "+7 7** *** **12" — полностью агенту не нужен.
  string masked_phone = 3;
  // Персональная скидка клиента в процентах * 100 (club_memberships.discount; 12.5% = 1250).
  int32 discount_basis_points = 4;
}

// Оплаченная сессия на ПК. Старый аналог: ClubComputerSessions::sessionPayload().
message ActiveSession {
  // ID сессии (club_computers.current_session_id).
  string session_id = 1;
  // Кто играет; 0 — гостевая сессия с кассы без аккаунта (session_guest = true).
  int64 user_id = 2;
  // Когда сессия заканчивается (по часам сервера).
  google.protobuf.Timestamp ends_at = 3;
  // true — сессию открыли на кассе без аккаунта: агент разблокирует ПК без входа.
  bool guest = 4;
  // Начало сессии.
  google.protobuf.Timestamp started_at = 5;
}

// Ссылка на ПК клуба (для карты пересадки, сообщений).
message ComputerRef {
  // club_computers.id.
  int64 computer_id = 1;
  // Номер ПК в клубе (строкой, как в панели: "7", "VIP-2").
  string number = 2;
  // Отображаемое имя (ClubComputer::displayName()).
  string display_name = 3;
  // Название зоны.
  string zone_name = 4;
}
