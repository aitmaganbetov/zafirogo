<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zafiro</title>
    <!-- Шрифт Inter и Font Awesome 6.4.0 — из npm в сборке (src/main.tsx, решение Q-064), без CDN. -->
    <!-- Как Zafiro resources/views/partials/pwa.blade.php (манифест — сервер, PwaController::manifest; Q-068) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#101713" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Zafiro" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <!-- Тема до стилей, чтобы ночная тема не мигала (layouts/admin.blade.php).
         Текст скрипта менять только вместе с его sha256 в CSP: server/internal/http/middleware.go -->
    <script>try{if(localStorage.getItem('zafiro.theme')==='dark')document.documentElement.classList.add('dark')}catch(e){}</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
