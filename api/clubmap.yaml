        display_name:
          type: string
          nullable: true
        mac_address:
          type: string
          nullable: true
        position_x:
          type: integer
          format: int64
        position_y:
          type: integer
          format: int64
        details:
          type: string
          description: «MAC … · LAN … · WAN … · CPU · N cores · N MB RAM · GPU · ОС» (как $computerDetails шаблона).
    MapTariff:
      type: object
      required: [id, name, duration_minutes, price_tiyn, currency, is_active, guest_sellable]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        duration_minutes:
          type: integer
          format: int64
        price_tiyn:
          type: integer
          format: int64
        currency:
          type: string
        is_active:
          type: boolean
        guest_sellable:
          type: boolean
          description: is_active && onSale() && inValidityPeriod() — показывается в «Подключить тариф».
    ClubMapPage:
      type: object
      required: [zones, computers, states, tariffs, guest_mode, booking_start]
      properties:
        zones:
          type: array
          items:
            $ref: "#/components/schemas/Zone"
        computers:
          type: array
          items:
            $ref: "#/components/schemas/ComputerCard"
        states:
          type: array
          items:
            $ref: "#/components/schemas/ComputerState"
        tariffs:
          type: array
          items:
            $ref: "#/components/schemas/MapTariff"
        guest_mode:
          type: boolean
          description: GuestFeatures::guestModeEnabled().
        booking_start:
          type: string
          description: Начало брони по умолчанию — следующий час клуба (Y-m-d\TH:i).
    ComputerState:
      type: object
      required: [id, zone_id, number, name, status, light, connection, is_reserved, has_session, session_guest, session_user, session_tariff, agent_state, agent_version, agent_outdated, staff_kind]
      properties:
        id:
          type: integer
          format: int64
        zone_id:
          type: integer
          format: int64
        number:
          type: integer
          format: int64
        name:
          type: string
        status:
          type: string
          description: ClubComputer::currentStatus() — reserved | offline | online | available | restarting.
        light:
          type: string
          description: Подсветка — pc-staff | pc-guest | pc-account | pc-free | "" (computerStates).
        connection:
          type: string
          enum: [online, offline]
        is_reserved:
          type: boolean
          description: Ручной флаг брони без времени (club_computers.is_reserved).
        has_session:
          type: boolean
        session_id:
          type: string
          nullable: true
        session_ends_at:
          type: string
          format: date-time
          nullable: true
        session_guest:
          type: boolean
        session_user_id:
          type: integer
          format: int64
          nullable: true
        session_user:
          type: string
          description: «Имя · телефон» клиента; гость — «Гость без аккаунта» (на языке клуба); без сессии — "".
        session_tariff:
          type: string
          description: "Что куплено в сессии (тарифы, «Поминутно N мин.»); гость без покупок — «Оплачено на кассе»."
        agent_state:
          type: string
        agent_version:
          type: string
        agent_outdated:
          type: boolean
        last_seen:
          type: string
          format: date-time
          nullable: true
        staff_until:
          type: string
          format: date-time
          nullable: true
        staff_name:
          type: string
          nullable: true
        staff_kind:
          type: string
        load:
          allOf:
            - $ref: "#/components/schemas/ComputerLoad"
          nullable: true
          description: Загрузка ПК (Этап 7) — только ПК в сети, чей агент её присылает; иначе поля нет.
        problems:
          type: array
          description: Проблемы здоровья, посчитанные сервером (Этап 7); только ПК в сети, иначе поля нет.
          items:
            $ref: "#/components/schemas/HealthProblem"
        rtt_ms:
          type: integer
          format: int64
          nullable: true
          description: Время ответа агента по стриму, мс (Этап 7).
    ComputerLoad:
      type: object
      required: [cpu_bp, ram_bp, idle_seconds]
      properties:
        cpu_bp:
          type: integer
          format: int64
          description: Загрузка CPU, сотые доли процента (0..10000).
        ram_bp:
          type: integer
          format: int64
          description: Занятая ОЗУ, сотые доли процента (0..10000).
        idle_seconds:
          type: integer
          format: int64
          description: Сколько секунд нет ввода с клавиатуры/мыши.
    HealthProblem:
      type: string
      description: |
        Проблема здоровья ПК (agent.health.*): cpu_hot / gpu_hot — перегрев; disk_low — мало места; disk_smart —
        SMART предупреждает или предсказывает отказ; mouse / keyboard / monitor — не подключены; network_slow —
        скорость сети упала; unstable — внезапные выключения или «синие экраны» за 7 суток.
      enum: [cpu_hot, gpu_hot, disk_low, disk_smart, mouse, keyboard, monitor, network_slow, unstable]
    ComputerHealthView:
      type: object
      required: [computer_id, connection, diskless, problems]
      properties:
        computer_id:
          type: integer
          format: int64
        diskless:
          $ref: "#/components/schemas/HealthDiskless"
        connection:
          type: string
          enum: [online, offline]
        agent_version:
          type: string
          nullable: true
        rtt_ms:
          type: integer
          format: int64
          nullable: true
        load:
          allOf:
            - $ref: "#/components/schemas/ComputerLoad"
          nullable: true
        health:
          allOf:
            - $ref: "#/components/schemas/HealthSnapshot"
          nullable: true
        problems:
          type: array
          items:
            $ref: "#/components/schemas/HealthProblem"
    HealthDiskless:
      type: boolean
      description: |
        Бездисковый ПК (загрузка по сети с сервера образов; последний сертификат ПК выпущен по ключу образа,
        agent_certificates.diskless). Локальных дисков нет: агент их не собирает, сервер не считает по ним проблемы и
        причины вердикта, disks пуст, поля системного диска и SMART недель — null (docs/agent-protocol.md §16.9).
    HealthSnapshot:
      type: object
      required: [reported_at, disks, peripherals, unexpected_shutdowns_7d, bugchecks_7d]
      properties:
        reported_at:
          type: string
          format: date-time
          description: Когда сервер получил измерения (аптайм — на этот момент).
        cpu_temp_deci:
          type: integer
          format: int64
          nullable: true
          description: Температура CPU, десятые доли °C (null — не измерено).
        gpu_temp_deci:
          type: integer
          format: int64
          nullable: true
        gpu_load_bp:
          type: integer
          format: int64
          nullable: true
          description: Загрузка GPU, сотые доли процента (null — не измерено).
        gpu_memory_bp:
          type: integer
          format: int64
          nullable: true
        disks:
          type: array
          items:
            $ref: "#/components/schemas/DiskView"
        peripherals:
          type: array
          items:
            $ref: "#/components/schemas/PeripheralView"
        link_mbps:
          type: integer
          format: int64
          nullable: true
          description: Скорость основного сетевого подключения, Мбит/с (null — не измерено).
        uptime_seconds:
          type: integer
          format: int64
          nullable: true
        unexpected_shutdowns_7d:
          type: integer
          format: int64
        bugchecks_7d:
          type: integer
          format: int64
    DiskView:
      type: object
      required: [mount, system, total_mb, free_mb]
      properties:
        mount:
          type: string
        system:
          type: boolean
        total_mb:
          type: integer
          format: int64
        free_mb:
          type: integer
          format: int64
        smart:
          type: string
          nullable: true
          description: SMART — ok | warning | failing; null — не измерено.
          enum: [ok, warning, failing]
          x-enum-varnames: [DiskSmartOk, DiskSmartWarning, DiskSmartFailing]
    PeripheralView:
      type: object
      required: [kind, connected, name]
      properties:
        kind:
          type: string
          enum: [mouse, keyboard, headset, monitor]
        connected:
          type: boolean
        name:
          type: string
    HealthEvent:
      type: object
      required: [id, kind, raised_at, details]
      properties:
        id:
          type: integer
          format: int64
        kind:
          $ref: "#/components/schemas/HealthProblem"
        raised_at:
          type: string
          format: date-time
        cleared_at:
          type: string
          format: date-time
          nullable: true
          description: Когда проблема ушла (null — ещё есть).
        details:
          type: object
          additionalProperties: true
          description: Подробности на момент появления (temp_deci, threshold_c, disks, mbps, previous_mbps, …).
    HealthWeek:
      type: object
      required: [start, end, online_minutes, session_minutes, cpu_hot_hours, gpu_hot_hours, problem_hours,
                 network_slow_hours, unexpected_shutdowns, bugchecks, peripheral_disconnects, verdict]
      properties:
        start:
          type: string
          format: date-time
          description: Начало недели — понедельник 00:00 в поясе клуба.
        end:
          type: string
          format: date-time
          description: Конец недели (не включительно).
        online_minutes:
          type: integer
          format: int64
          description: Минут в сети.
        session_minutes:
          type: integer
          format: int64
          description: Минут в сессии.
        cpu_load_avg_bp:
          type: integer
          format: int64
          nullable: true
          description: Средняя загрузка CPU за неделю (по минутам в сети), сотые доли процента.
        cpu_load_max_bp:
          type: integer
          format: int64
          nullable: true
        ram_avg_bp:
          type: integer
          format: int64
          nullable: true
        ram_max_bp:
          type: integer
          format: int64
          nullable: true
        gpu_load_avg_bp:
          type: integer
          format: int64
          nullable: true
        gpu_load_max_bp:
          type: integer
          format: int64
          nullable: true
        cpu_temp_avg_deci:
          type: integer
          format: int64
          nullable: true
          description: Средняя температура CPU, десятые доли °C.
        cpu_temp_max_deci:
          type: integer
          format: int64
          nullable: true
        gpu_temp_avg_deci:
          type: integer
          format: int64
          nullable: true
        gpu_temp_max_deci:
          type: integer
          format: int64
          nullable: true
        cpu_hot_hours:
          type: integer
          format: int64
          description: Часов, когда максимум температуры CPU был не ниже порога перегрева (agent.health.cpu_temp_c).
        gpu_hot_hours:
          type: integer
          format: int64
        problem_hours:
          type: integer
          format: int64
          description: Часов в сети, когда была открыта хоть одна проблема здоровья (computer_health_events).
        network_slow_hours:
          type: integer
          format: int64
          description: Часов в сети, когда была открыта проблема network_slow (скорость сети ниже порога).
        unexpected_shutdowns:
          type: integer
          format: int64
          description: Внезапных выключений за неделю.
        bugchecks:
          type: integer
          format: int64
          description: «Синих экранов» за неделю.
        peripheral_disconnects:
          type: integer
          format: int64
          description: Сколько раз отключались мышь, клавиатура или монитор.
        system_disk_free_mb:
          type: integer
          format: int64
          nullable: true
          description: Минимум свободного места на системном диске, МБ.
        system_disk_free_bp:
          type: integer
          format: int64
          nullable: true
          description: Минимум свободного места на системном диске, сотые доли процента.
        smart:
          type: string
          nullable: true
          description: Худшее состояние SMART за неделю (null — не измерено).
          enum: [ok, warning, failing]
          x-enum-varnames: [WeekSmartOk, WeekSmartWarning, WeekSmartFailing]
        verdict:
          $ref: "#/components/schemas/HealthVerdict"
    HealthVerdict:
      type: object
      required: [level, reasons]
      description: |
        Вердикт исправности за неделю (docs/agent-protocol.md §16.7): ok — исправен, watch — наблюдать, repair — требует
        ремонта; уровень — наихудший из причин.
      properties:
        level:
          type: string
          enum: [ok, watch, repair]
          x-enum-varnames: [VerdictOk, VerdictWatch, VerdictRepair]
        reasons:
          type: array
          items:
            $ref: "#/components/schemas/HealthVerdictReason"
    HealthVerdictReason:
      type: object
      required: [code, level, value, threshold]
      properties:
        code:
          type: string
          description: |
            smart_failing / smart_warning — SMART диска; bugchecks — «синие экраны» (value — сколько, threshold — порог);
            cpu_hot / gpu_hot — часов перегрева (value — часы, threshold — °C); shutdowns — внезапные выключения;
            disk_low — свободно на системном диске (value, threshold — %); cpu_temp_rise / gpu_temp_rise — рост средней
            температуры к прошлой неделе (value, threshold — °C); network_slow — только у бездискового ПК: часов с медленной
            сетью (value — часы, threshold — Мбит/с).
          enum: [smart_failing, bugchecks, cpu_hot, gpu_hot, smart_warning, shutdowns, disk_low, cpu_temp_rise, gpu_temp_rise,
                 network_slow]
        level:
          type: string
          enum: [watch, repair]
          x-enum-varnames: [ReasonWatch, ReasonRepair]
        value:
          type: integer
          format: int64
        threshold:
          type: integer
          format: int64
    HealthWeekPage:
      type: object
      required: [diskless, weeks]
      properties:
        diskless:
          $ref: "#/components/schemas/HealthDiskless"
        weeks:
          type: array
          items:
            $ref: "#/components/schemas/HealthWeek"
    HealthHour:
