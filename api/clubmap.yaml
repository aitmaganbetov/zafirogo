          format: int64
          nullable: true
        cpu_load_max_bp:
          type: integer
          format: int64
          nullable: true
        ram_avg_bp:
          type: integer
          format: int64
          nullable: true
        ram_max_bp:
          type: integer
          format: int64
          nullable: true
        gpu_load_avg_bp:
          type: integer
          format: int64
          nullable: true
        gpu_load_max_bp:
          type: integer
          format: int64
          nullable: true
        cpu_temp_avg_deci:
          type: integer
          format: int64
          nullable: true
        cpu_temp_max_deci:
          type: integer
          format: int64
          nullable: true
        gpu_temp_avg_deci:
          type: integer
          format: int64
          nullable: true
        gpu_temp_max_deci:
          type: integer
          format: int64
          nullable: true
    HealthHourPage:
      type: object
      required: [diskless, items]
      properties:
        diskless:
          $ref: "#/components/schemas/HealthDiskless"
        items:
          type: array
          items:
            $ref: "#/components/schemas/HealthHour"
    HealthEventPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/HealthEvent"
        next_cursor:
          type: string
          nullable: true
    ClubMapState:
      type: object
      required: [computers]
      properties:
        computers:
          type: array
          items:
            $ref: "#/components/schemas/ComputerState"
