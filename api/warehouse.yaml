openapi: 3.0.3
info:
  title: zafirogo API — warehouse
  version: 0.1.0
  description: |
    Склад (WarehouseController, ProductController, StockMovementController).
    Конвенции — api/README.md. Деньги — целые тиыны (integer, int64), никогда number.
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /api/warehouse/products:
    get:
      operationId: listProducts
      tags: [warehouse]
      summary: Товары склада
      description: |
        Laravel: WarehouseController (warehouse, warehouse.view). По имени; поиск — подстрока имени или SKU.
        Пагинация keyset: cursor = next_cursor предыдущей страницы; или номер страницы page (таблица «Склад»,
        paginate(50) с ->links(); без поиска). total — всего товаров (с поиском — найденных).
      parameters:
        - $ref: "common.yaml#/components/parameters/Search"
        - $ref: "common.yaml#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Page"
        - $ref: "common.yaml#/components/parameters/Limit"
      responses:
        "200":
          description: Страница товаров.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductPage"
        "400":
          $ref: "common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "common.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "common.yaml#/components/responses/Forbidden"
    post:
      operationId: createProduct
      tags: [warehouse]
      summary: Новый товар
      description: |
        Laravel: ProductController, CreateProductAction (warehouse.products.store, warehouse.create). Начальный остаток
        > 0 — движение «Начальный остаток при создании товара».
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductRequest"
      responses:
        "201":
          description: Товар создан.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "401":
          $ref: "common.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "common.yaml#/components/responses/Forbidden"
        "422":
          $ref: "common.yaml#/components/responses/ValidationFailed"
  /api/warehouse/products/{productId}:
    delete:
      operationId: deleteProduct
      tags: [warehouse]
      summary: Удалить товар
      description: |
        Laravel: ProductDeleteController (warehouse.products.destroy, warehouse.delete — по умолчанию только владелец):
        SKU освобождается ('<sku>~deleted-<id>'), товар скрывается (SoftDelete); история движений и чеки остаются.
        Журнал product.deleted {sku, quantity}.
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: Удалённый товар (до удаления).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "401":
          $ref: "common.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "common.yaml#/components/responses/NotFound"
    patch:
      operationId: updateProduct
      tags: [warehouse]
      summary: Изменить товар
      description: |
        Laravel: UpdateProductAction (warehouse.products.update, warehouse.update). Остаток меняется только движениями.
      parameters:
        - $ref: "#/components/parameters/ProductId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductRequest"
      responses:
        "200":
          description: Товар после правки.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "401":
          $ref: "common.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "common.yaml#/components/responses/NotFound"
        "422":
          $ref: "common.yaml#/components/responses/ValidationFailed"
  /api/warehouse/stock-movements:
    post:
      operationId: createStockMovement
      tags: [warehouse]
      summary: Оприходовать или списать товар
      description: |
        Laravel: StockMovementController, AdjustStockAction (warehouse.stock-movements.store, warehouse.update).
        Списание больше остатка — 422 «Нельзя списать больше, чем есть на складе.».
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockMovementRequest"
      responses:
        "201":
          description: Движение записано.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockMovementResult"
        "401":
          $ref: "common.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "common.yaml#/components/responses/Forbidden"
        "422":
          $ref: "common.yaml#/components/responses/ValidationFailed"
  /api/warehouse/categories:
    get:
      operationId: listProductCategories
      tags: [warehouse]
      summary: Категории товаров
      description: |
        Laravel: WarehouseController (warehouse, warehouse.view).
      responses:
        "200":
          description: Категории.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductCategory"
        "401":
          $ref: "common.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "common.yaml#/components/responses/Forbidden"
    post:
      operationId: createProductCategory
      tags: [warehouse]
      summary: Новая категория
      description: |
        Laravel: ProductCategoryController (warehouse.categories.store, warehouse.create): name required|max:100,
        уникально в клубе. Журнал warehouse.category_created.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductCategoryRequest"
      responses:
        "201":
          description: Категория создана.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductCategory"
        "401":
          $ref: "common.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "common.yaml#/components/responses/Forbidden"
        "422":
          $ref: "common.yaml#/components/responses/ValidationFailed"
  /api/warehouse/overview:
    get:
      operationId: getWarehouseOverview
      tags: [warehouse]
      summary: Каталог склада — категории, число товаров, последние движения
      description: |
        Laravel: WarehouseController (warehouse, warehouse.view): категории с числом товаров (withCount), число товаров,
        последние 10 движений (latest()->limit(10)).
      responses:
        "200":
          description: Сводка склада.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarehouseOverview"
        "401":
          $ref: "common.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "common.yaml#/components/responses/Forbidden"
  /api/stock:
    get:
      operationId: listStock
      tags: [warehouse]
      summary: Остатки товаров (для кассира и оператора)
      description: |
        Laravel: StockController::index() (stock.index, stock.view): поиск — подстрока имени или SKU (search max:100),
        по категории и имени, paginate(50).
      parameters:
        - $ref: "common.yaml#/components/parameters/Search"
        - $ref: "#/components/parameters/Page"
      responses:
        "200":
          description: Страница остатков.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockPage"
        "401":
          $ref: "common.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "common.yaml#/components/responses/Forbidden"
  /api/stock/receive:
    post:
      operationId: receiveStock
      tags: [warehouse]
      summary: Оприходовать товар (кассир, оператор)
      description: |
        Laravel: StockController::receive() (stock.receive, stock.create): product_id (товар клуба), quantity
        integer|min:1|max:100000, note nullable|max:255 → AdjustStockAction (receipt). Журнал stock.received,
        вебхук stock.changed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceiveStockRequest"
      responses:
        "201":
          description: Движение записано.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockMovementResult"
        "401":
          $ref: "common.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "common.yaml#/components/responses/Forbidden"
        "422":
          $ref: "common.yaml#/components/responses/ValidationFailed"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Access-токен из ответа login/refresh (~10 мин).
    refreshCookie:
      type: apiKey
      in: cookie
      name: __Secure-zafiro_rt
      description: Refresh-токен (HttpOnly). Только для /api/auth/refresh и /api/auth/logout.
  parameters:
    Page:
      name: page
      in: query
      required: false
      description: Номер страницы (с 1), как ?page= Laravel.
      schema:
        type: integer
        minimum: 1
        maximum: 100000
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: integer
        format: int64
  schemas:
    Product:
      type: object
      required: [id, sku, name, category, price_tiyn, quantity]
      properties:
        id:
          type: integer
          format: int64
        sku:
          type: string
        name:
          type: string
        category:
          type: string
        product_category_id:
          type: integer
          format: int64
          nullable: true
        price_tiyn:
          type: integer
          format: int64
        quantity:
          type: integer
          format: int64
    ProductPage:
      type: object
      required: [items, next_cursor, total, per_page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        next_cursor:
          type: string
          nullable: true
        total:
          type: integer
          format: int64
        per_page:
          type: integer
    WarehouseCategory:
      type: object
      required: [id, name, products_count]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        products_count:
          type: integer
          format: int64
    WarehouseMovement:
      type: object
      required: [id, product_id, product_name, type, quantity, balance_after, note, created_at]
      properties:
        id:
          type: integer
          format: int64
        product_id:
          type: integer
          format: int64
        product_name:
          type: string
        type:
          type: string
          enum: [receipt, write_off]
        quantity:
          type: integer
          format: int64
        balance_after:
          type: integer
          format: int64
        note:
          type: string
          nullable: true
          description: Комментарий как записан (маркер «Продажа POS» не переводится).
        created_at:
          type: string
          format: date-time
          nullable: true
    WarehouseOverview:
      type: object
      required: [categories, products_total, movements]
      properties:
        categories:
          type: array
          items:
            $ref: "#/components/schemas/WarehouseCategory"
        products_total:
          type: integer
          format: int64
        movements:
          type: array
          items:
            $ref: "#/components/schemas/WarehouseMovement"
    CreateProductCategoryRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
    StockProduct:
      type: object
      required: [id, sku, name, category, price_tiyn, quantity, image_url]
      properties:
        id:
          type: integer
          format: int64
        sku:
          type: string
        name:
          type: string
        category:
          type: string
        price_tiyn:
          type: integer
          format: int64
        quantity:
          type: integer
          format: int64
        image_url:
          type: string
    StockPage:
      type: object
      required: [items, total, per_page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/StockProduct"
        total:
          type: integer
          format: int64
        per_page:
          type: integer
    ReceiveStockRequest:
      type: object
      additionalProperties: false
      required: [product_id, quantity]
      properties:
        product_id:
          type: integer
          format: int64
        quantity:
          type: integer
          format: int64
        note:
          type: string
          nullable: true
    ProductCategory:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    CreateProductRequest:
      type: object
      additionalProperties: false
      required: [sku, name, product_category_id, price_tiyn, quantity]
      properties:
        sku:
          type: string
        name:
          type: string
        product_category_id:
          type: integer
          format: int64
        price_tiyn:
          type: integer
          format: int64
        quantity:
          type: integer
          format: int64
    UpdateProductRequest:
      type: object
      additionalProperties: false
      properties:
        sku:
          type: string
        name:
          type: string
        product_category_id:
          type: integer
          format: int64
        price_tiyn:
          type: integer
          format: int64
    StockMovementRequest:
      type: object
      additionalProperties: false
      required: [product_id, type, quantity]
      properties:
        product_id:
          type: integer
          format: int64
        type:
          type: string
          description: receipt | write_off
        quantity:
          type: integer
          format: int64
        note:
          type: string
          nullable: true
    StockMovementResult:
      type: object
      required: [id, product, type, quantity, balance_after]
      properties:
        id:
          type: integer
          format: int64
        product:
          $ref: "#/components/schemas/Product"
        type:
          type: string
          enum: [receipt, write_off]
        quantity:
          type: integer
          format: int64
        balance_after:
          type: integer
          format: int64
