openapi: 3.0.3
info:
  title: zafirogo API
  version: 0.1.0
  description: |
    REST API админки и веб-интерфейса zafirogo.
    Сервер генерируется oapi-codegen (chi strict server) в server/internal/http/api,
    типы фронта — openapi-typescript в web/src/api/schema.d.ts.
    Деньги во всех схемах — целые тиыны (integer, format int64), никогда number.
servers:
  - url: /
tags:
  - name: system
    description: Служебные эндпоинты (проверки живости и готовности).
  - name: auth
    description: |
      Вход сотрудника, сессия, выбор клуба (Laravel: AuthController, ClubController::switch, SetCurrentClub).
      Access-токен — в памяти SPA (заголовок Authorization: Bearer), срок ~10 мин. Refresh-токен — только в cookie
      `__Secure-zafiro_rt` (HttpOnly, Secure, SameSite=Strict, Path=/api/auth), ротация при каждом обновлении.
      Эндпоинты с cookie (refresh, logout) требуют заголовок X-CSRF-Token со значением cookie `__Host-zafiro_csrf`.
  - name: superadmin
    description: Кабинет суперадмина — режим просмотра клуба только для чтения.
  - name: cash
    description: Касса (Laravel CashRegisterController, CashRegisterService). Суммы — целые тиыны (*_tiyn).
  - name: warehouse
    description: Склад (WarehouseController, ProductController, StockMovementController).
  - name: customers
    description: Клиенты клуба и их балансы (UserController); история баланса — из журнала операций (ledger).
  - name: tariffs
    description: Тарифы (только чтение).
  - name: sessions
    description: Сессии ПК со стороны сотрудника (гостевая сессия, завершение, пересадка).
  - name: club-map
    description: Карта клуба (ClubZoneController::state).
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      operationId: getHealthz
      tags: [system]
      summary: Liveness-проверка
      description: Процесс жив и обслуживает HTTP. Зависимости не проверяет.
      security: []
      responses:
        "200":
          description: Процесс жив.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      operationId: getReadyz
      tags: [system]
      summary: Readiness-проверка
      description: |
        Проверяет зависимости (пока только PostgreSQL, если задан ZAFIRO_DATABASE_URL).
        Текст ошибок наружу не отдаётся — только статус каждой проверки.
      security: []
      responses:
        "200":
          description: Все зависимости доступны.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: Хотя бы одна зависимость недоступна.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
  /api/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Вход по телефону и паролю
      description: |
        Laravel: AuthController::login(). Телефон нормализуется (+7 и 10 цифр), сначала выбирается клуб,
        где пользователь — сотрудник. Ставит cookie refresh-токена и CSRF. Ошибки — 422 с полем формы
        и текстом старого кода («Неверные учетные данные.» и т. п.). Лимит web-login выключен по умолчанию
        (в старом его не было).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Вход выполнен.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/auth/refresh:
    post:
      operationId: refreshSession
      tags: [auth]
      summary: Новый access-токен по refresh-cookie (ротация)
      description: |
        Refresh-токен из cookie заменяется новым. Повтор уже использованного токена отзывает всю сессию (401).
        Повтор только что заменённого токена в течение нескольких секунд (две вкладки) — 409, сессия жива:
        повторите запрос.
      security:
        - refreshCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: Сессия обновлена.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Токен уже обновлён параллельным запросом; повторите.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Выход (текущая сессия)
      description: |
        Laravel: AuthController::logout(). По access-токену или по refresh-cookie (с X-CSRF-Token).
        Cookie удаляются. Отсутствующая сессия — тоже 204.
      security:
        - bearerAuth: []
        - refreshCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFTokenOptional"
      responses:
        "204":
          description: Сессия завершена.
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/auth/logout-all:
    post:
      operationId: logoutAll
      tags: [auth]
      summary: Выход на всех устройствах
      responses:
        "204":
          description: Все сессии пользователя завершены.
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /api/auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Текущий пользователь, клуб, роль и права
      responses:
        "200":
          description: Текущий пользователь.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /api/auth/club:
    put:
      operationId: selectClub
      tags: [auth]
      summary: Перейти в другой клуб пользователя
      description: |
        Laravel: ClubController::switch() — нужен клуб, где у пользователя есть членство, иначе 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelectClubRequest"
      responses:
        "200":
          description: Клуб выбран.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/superadmin/clubs/{clubId}/view:
    post:
      operationId: superadminViewClub
      tags: [superadmin]
      summary: Открыть клуб на просмотр (только чтение)
      description: |
        Laravel: Superadmin\ClubController::view(). Панель клуба как у владельца, но любые изменения
        (не GET/HEAD) — 403 «Режим просмотра: суперадмин не может ничего менять в клубе.».
      parameters:
        - name: clubId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: Режим просмотра включён.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/superadmin/leave-club:
    post:
      operationId: superadminLeaveClub
      tags: [superadmin]
      summary: Выйти из режима просмотра клуба
      description: |
        Laravel: Superadmin\ClubController::leave().
      responses:
        "200":
          description: Режим просмотра выключен.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/cash/shift:
    get:
      operationId: getCashShift
      tags: [cash]
      summary: Открытая смена и её итоги
      description: |
        Laravel: CashRegisterController::index() (маршрут cash-register.index, право cash.view).
        Нет открытой смены — shift и totals равны null.
      responses:
        "200":
          description: Состояние кассы.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashShiftState"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/cash/shifts:
    post:
      operationId: openCashShift
      tags: [cash]
      summary: Открыть смену
      description: |
        Laravel: CashRegisterController::open(), CashRegisterService::open() (cash-register.shifts.open, cash.create).
        Ошибка «Смена уже открыта.» — 422 на поле opening_balance.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenShiftRequest"
      responses:
        "201":
          description: Смена открыта.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashShiftState"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/cash/shifts/{shiftId}/close:
    post:
      operationId: closeCashShift
      tags: [cash]
      summary: Закрыть смену
      description: |
        Laravel: CashRegisterController::close(), CashRegisterService::close() (cash-register.shifts.close, cash.create).
        Без отметки печати Z-отчёта — 422 «Сначала распечатайте Z-отчёт. Без печати смена не закрывается.» (поле shift).
      parameters:
        - $ref: "#/components/parameters/ShiftId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Смена закрыта.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashShiftState"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/cash/reports/x:
    get:
      operationId: getCashXReport
      tags: [cash]
      summary: X-отчёт открытой смены
      description: |
        Laravel: CashRegisterController::xReport() (cash-register.x-report, cash.view). Нет открытой смены — 404.
      responses:
        "200":
          description: Отчёт.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashReport"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/cash/shifts/{shiftId}/z-report:
    get:
      operationId: getCashZReport
      tags: [cash]
      summary: Z-отчёт смены
      description: |
        Laravel: CashRegisterController::zReport() (cash-register.z-report, cash.view). Nonce печати выдаёт отдельный
        POST …/z-report/nonce (в старом коде его ставил тот же GET в сессию).
      parameters:
        - $ref: "#/components/parameters/ShiftId"
      responses:
        "200":
          description: Отчёт.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashReport"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/cash/shifts/{shiftId}/z-report/nonce:
    post:
      operationId: issueZReportNonce
      tags: [cash]
      summary: Одноразовый nonce печати Z-отчёта
      description: |
        Laravel: CashRegisterController::zReport() — Str::random(40) в сессию (cash-register.z-report, cash.view).
        Прежний nonce смены перестаёт действовать. В БД хранится только его хеш.
      parameters:
        - $ref: "#/components/parameters/ShiftId"
      responses:
        "200":
          description: Nonce.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZReportNonce"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/cash/shifts/{shiftId}/z-report/printed:
    post:
      operationId: markZReportPrinted
      tags: [cash]
      summary: Отметка «Z-отчёт напечатан»
      description: |
        Laravel: CashRegisterController::markZReportPrinted() (cash-register.z-report.printed, cash.create).
        Смена не открыта — 422; nonce неверный или уже использован — 419 (как в старом коде).
      parameters:
        - $ref: "#/components/parameters/ShiftId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ZReportPrintedRequest"
      responses:
        "200":
          description: Отмечено.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZReportPrinted"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "419":
          description: Nonce неверный или уже использован.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Смена не открыта.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/cash/sales:
    post:
      operationId: createCashSale
      tags: [cash]
      summary: Продажа POS
      description: |
        Laravel: CashRegisterController::sale(), CashRegisterService::sale() (cash-register.sales.store, cash.create).
        Повтор с тем же Idempotency-Key и теми же строками — та же продажа (replayed = true), с другими — 409.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaleRequest"
      responses:
        "201":
          description: Продажа проведена.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashOperationResult"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/cash/balance-top-ups:
    post:
      operationId: createBalanceTopUp
      tags: [cash]
      summary: Пополнение баланса клиента на кассе
      description: |
        Laravel: CashRegisterController::topUpBalance(), CashRegisterService::topUpBalance()
        (cash-register.balance-top-ups.store, cash.create). Бонус за пополнение — по настройкам клуба.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TopUpRequest"
      responses:
        "201":
          description: Баланс пополнен.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopUpResult"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/cash/transactions:
    post:
      operationId: createCashTransaction
      tags: [cash]
      summary: Приход или расход кассы
      description: |
        Laravel: CashRegisterController::transaction(), CashRegisterService::transact()
        (cash-register.transactions.store, cash.create).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CashTransactionRequest"
      responses:
        "201":
          description: Операция проведена.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashOperationResult"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/cash/operations:
    get:
      operationId: listCashOperations
      tags: [cash]
      summary: Приходы открытой смены (для возвратов)
      description: |
        Laravel: CashRegisterController::operations() (cash-register.operations, cash.view): приходы открытой смены,
        новые сверху, с возвратом. Нет открытой смены — 404. Пагинация keyset: before_id = next_before_id.
      parameters:
        - name: before_id
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 1
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Страница операций.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashOperationPage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/cash/receipts/{transactionId}:
    get:
      operationId: getCashReceipt
      tags: [cash]
      summary: Чек прихода
      description: |
        Laravel: CashRegisterController::receipt() (cash-register.receipt, cash.view). Не приход — 404.
      parameters:
        - $ref: "#/components/parameters/TransactionId"
      responses:
        "200":
          description: Чек.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashReceipt"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/cash/receipts/{transactionId}/refund:
    post:
      operationId: refundCashReceipt
      tags: [cash]
      summary: Возврат по чеку
      description: |
        Laravel: CashRegisterController::refund(), CashRegisterService::refund() (cash-register.refund, cash.delete;
        отказ — 403 «Нет права на возвраты. Его даёт владелец клуба в «Настройки → Права».»).
        Повтор с тем же Idempotency-Key — тот же ответ.
      parameters:
        - $ref: "#/components/parameters/TransactionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Возврат проведён.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefundResult"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/warehouse/products:
    get:
      operationId: listProducts
      tags: [warehouse]
      summary: Товары склада
      description: |
        Laravel: WarehouseController (warehouse, warehouse.view). По имени; поиск — подстрока имени или SKU.
        Пагинация keyset: cursor = next_cursor предыдущей страницы.
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Страница товаров.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createProduct
      tags: [warehouse]
      summary: Новый товар
      description: |
        Laravel: ProductController, CreateProductAction (warehouse.products.store, warehouse.create). Начальный остаток
        > 0 — движение «Начальный остаток при создании товара».
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductRequest"
      responses:
        "201":
          description: Товар создан.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/warehouse/products/{productId}:
    patch:
      operationId: updateProduct
      tags: [warehouse]
      summary: Изменить товар
      description: |
        Laravel: UpdateProductAction (warehouse.products.update, warehouse.update). Остаток меняется только движениями.
      parameters:
        - $ref: "#/components/parameters/ProductId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductRequest"
      responses:
        "200":
          description: Товар после правки.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/warehouse/stock-movements:
    post:
      operationId: createStockMovement
      tags: [warehouse]
      summary: Оприходовать или списать товар
      description: |
        Laravel: StockMovementController, AdjustStockAction (warehouse.stock-movements.store, warehouse.update).
        Списание больше остатка — 422 «Нельзя списать больше, чем есть на складе.».
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockMovementRequest"
      responses:
        "201":
          description: Движение записано.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockMovementResult"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/warehouse/categories:
    get:
      operationId: listProductCategories
      tags: [warehouse]
      summary: Категории товаров
      description: |
        Laravel: WarehouseController (warehouse, warehouse.view).
      responses:
        "200":
          description: Категории.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductCategory"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/customers:
    get:
      operationId: listCustomers
      tags: [customers]
      summary: Клиенты клуба
      description: |
        Laravel: UserController::index() (users.index, customers.view): членства не из ClubRoles::STAFF с балансами,
        по user_id. Поиск — подстрока имени или телефона. Пагинация keyset: after_id = next_after_id.
      parameters:
        - $ref: "#/components/parameters/Search"
        - name: after_id
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Страница клиентов.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerPage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/customers/{userId}:
    get:
      operationId: getCustomer
      tags: [customers]
      summary: Клиент и его балансы
      description: |
        Laravel: UserController (users.index, customers.view). Сотрудник или чужой клуб — 404.
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Клиент.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/customers/{userId}/ledger:
    get:
      operationId: listCustomerLedger
      tags: [customers]
      summary: История баланса клиента (журнал операций)
      description: |
        Проводки по основному и бонусному балансу клиента (ledger), новые сверху (users.index, customers.view).
        Пагинация keyset: cursor = next_cursor.
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Страница проводок.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LedgerPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/customers/{userId}/balance-adjustments:
    post:
      operationId: adjustCustomerBalance
      tags: [customers]
      summary: Пополнение или списание баланса владельцем без кассы
      description: |
        Laravel: UserController::update() — top_up_amount / balance_action (users.update, customers.update; только роль
        owner, иначе 422 «Пополнять и списывать баланс без кассы может только владелец клуба.»).
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BalanceAdjustmentRequest"
      responses:
        "200":
          description: Баланс изменён.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceAdjustmentResult"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/customers/{userId}/initial-balance:
    post:
      operationId: setCustomerInitialBalance
      tags: [customers]
      summary: Начальный баланс нового клиента
      description: |
        Laravel: UserController::store() — balance / bonus_balance формы (users.store, customers.create; суммы задаёт
        только право customer_money.update, иначе 403 «Скидку и баланс клиента задаёт менеджер; пополнение — через кассу.»).
        Один раз на клиента: другой запрос с другими суммами — 409.
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitialBalanceRequest"
      responses:
        "200":
          description: Балансы клиента.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/tariffs:
    get:
      operationId: listTariffs
      tags: [tariffs]
      summary: Тарифы и цены часа по зонам
      description: |
        Laravel: TariffController::index() (tariffs.index, tariffs.view). Только чтение.
      responses:
        "200":
          description: Тарифы и зоны.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TariffList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/club-computers/guest-session:
    post:
      operationId: sellGuestSession
      tags: [sessions]
      summary: Гостевая сессия на кассе
      description: |
        Laravel: GuestSessionController::store(), GuestSessions::sell() (club-computers.guest-session, cash.create;
        throttle 30/мин). Время без аккаунта на выбранных ПК, оплата в открытую смену.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestSessionRequest"
      responses:
        "201":
          description: Сессии открыты.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestSessionResult"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/club-computers/{computerId}/end-session:
    post:
      operationId: endComputerSession
      tags: [sessions]
      summary: Завершить сессию ПК (сотрудник)
      description: |
        Laravel: ClubComputerSessions::end() с isStaff (club-computers.end-sessions, pc_control.delete). Неиспользованные
        минуты возвращаются на балансы, остаток тарифа с лимитом сохраняется пакетом.
      parameters:
        - $ref: "#/components/parameters/ComputerId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EndSessionRequest"
      responses:
        "200":
          description: Сессия завершена.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EndSessionResult"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/club-map/state:
    get:
      operationId: getClubMapState
      tags: [club-map]
      summary: Состояние ПК на карте клуба
      description: |
        Laravel: ClubZoneController::state() (club-map.state, club_map.view). Сессии — из БД, связь с агентом
        (online/offline, версия) — из присутствия агента (Valkey). Дальше — события computer.* по WebSocket.
      responses:
        "200":
          description: ПК клуба.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClubMapState"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Access-токен из ответа login/refresh (~10 мин).
    refreshCookie:
      type: apiKey
      in: cookie
      name: __Secure-zafiro_rt
      description: Refresh-токен (HttpOnly). Только для /api/auth/refresh и /api/auth/logout.
  parameters:
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Значение cookie __Host-zafiro_csrf.
      schema:
        type: string
        maxLength: 128
    CSRFTokenOptional:
      name: X-CSRF-Token
      in: header
      required: false
      description: Обязателен при выходе по refresh-cookie (без access-токена).
      schema:
        type: string
        maxLength: 128
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Ключ идемпотентности денежного запроса (SPA генерирует UUID на каждую отправку формы, CSQ-4).
        Повтор с тем же ключом и тем же телом — тот же ответ; с другим телом — 409.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    ShiftId:
      name: shiftId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    TransactionId:
      name: transactionId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ComputerId:
      name: computerId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    Search:
      name: q
      in: query
      required: false
      description: Поиск — подстрока без учёта регистра.
      schema:
        type: string
        maxLength: 100
    Cursor:
      name: cursor
      in: query
      required: false
      description: Непрозрачный курсор следующей страницы (next_cursor).
      schema:
        type: string
        maxLength: 512
    Limit:
      name: limit
      in: query
      required: false
      description: Размер страницы (по умолчанию 25, как paginate(25) старого кода).
      schema:
        type: integer
        minimum: 1
        maximum: 100
  responses:
    Unauthenticated:
      description: Нет действующей сессии.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Нет прав (текст — как в старом коде).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Не найдено.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationFailed:
      description: Ошибка в полях формы.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationError"
    TooManyRequests:
      description: |
        Превышен лимит (throttle). Заголовки Retry-After, X-RateLimit-Limit, X-RateLimit-Remaining, X-RateLimit-Reset.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Неверный запрос (параметр, курсор, нет заголовка Idempotency-Key).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Ключ идемпотентности уже использован запросом с другим телом (idempotency_conflict).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Машинный код (unauthenticated, forbidden, read_only, not_found, too_many_requests, …).
        message:
          type: string
          description: Текст для пользователя (русский текст = ключ перевода).
    ValidationError:
      type: object
      required: [error, message, errors]
      properties:
        error:
          type: string
          enum: [validation_failed]
        message:
          type: string
          description: Первая ошибка.
        errors:
          type: object
          description: Поле формы → тексты ошибок (как Laravel withErrors).
          additionalProperties:
            type: array
            items:
              type: string
    LoginRequest:
      type: object
      additionalProperties: false
      required: [phone, password]
      properties:
        phone:
          type: string
          maxLength: 64
          description: Телефон в любом виде (8 701…, +7 (701)…); нормализуется к +7XXXXXXXXXX.
        password:
          type: string
          maxLength: 4096
        remember:
          type: boolean
          default: false
          description: Флаг «Запомнить меня» — сессия живёт дольше без активности.
        pc_login:
          type: boolean
          default: false
          description: Вход ради подтверждения входа на ПК по QR (/pc-login/{code}) — разрешён и клиентам.
    SelectClubRequest:
      type: object
      additionalProperties: false
      required: [club_id]
      properties:
        club_id:
          type: integer
          format: int64
          minimum: 1
    AuthSession:
      type: object
      required: [access_token, token_type, expires_in, csrf_token, me]
      properties:
        access_token:
          type: string
          description: Держать только в памяти SPA.
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Срок access-токена, секунды.
        csrf_token:
          type: string
          description: То же значение, что в cookie __Host-zafiro_csrf (для X-CSRF-Token).
        me:
          $ref: "#/components/schemas/Me"
    MeUser:
      type: object
      required: [id, name, phone, is_superadmin]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        phone:
          type: string
        is_superadmin:
          type: boolean
    MeClub:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    MembershipItem:
      type: object
      required: [club_id, club_name, role]
      properties:
        club_id:
          type: integer
          format: int64
        club_name:
          type: string
        role:
          type: string
    Me:
      type: object
      required: [user, club, role, permissions, read_only, clubs]
      properties:
        user:
          $ref: "#/components/schemas/MeUser"
        club:
          description: Выбранный клуб; null — не выбран (суперадмин без клуба).
          nullable: true
          allOf:
            - $ref: "#/components/schemas/MeClub"
        role:
          type: string
          nullable: true
          description: Роль в клубе (owner, admin, manager, cashier, operator, client, …).
        permissions:
          type: array
          description: Права «раздел.действие» в клубе (ClubPermissions::allows), уже с выбором владельца.
          items:
            type: string
        read_only:
          type: boolean
          description: Суперадмин смотрит клуб — изменения запрещены.
        clubs:
          type: array
          description: Клубы пользователя для переключения (в режиме просмотра — пусто).
          items:
            $ref: "#/components/schemas/MembershipItem"
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Readiness:
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, fail]
        checks:
          type: object
          description: Результат каждой проверки по имени зависимости.
          additionalProperties:
            type: string
            enum: [ok, fail]
    CashShift:
      type: object
      required: [id, status, opening_balance_tiyn, opened_at, z_report_printed]
      properties:
        id:
          type: integer
          format: int64
        status:
          type: string
          enum: [open, closed]
        opened_by:
          type: integer
          format: int64
          nullable: true
        closed_by:
          type: integer
          format: int64
          nullable: true
        opening_balance_tiyn:
          type: integer
          format: int64
        closing_balance_tiyn:
          type: integer
          format: int64
          nullable: true
        opened_at:
          type: string
          format: date-time
        closed_at:
          type: string
          format: date-time
          nullable: true
        z_report_printed:
          type: boolean
          description: Z-отчёт напечатан (без этого смена не закрывается).
    CashTotals:
      type: object
      required: [opening_tiyn, income_tiyn, expense_tiyn, balance_tiyn]
      properties:
        opening_tiyn:
          type: integer
          format: int64
        income_tiyn:
          type: integer
          format: int64
        expense_tiyn:
          type: integer
          format: int64
        balance_tiyn:
          type: integer
          format: int64
          description: Остаток смены = начальный + приход − расход.
    CashShiftState:
      type: object
      required: [shift, totals]
      properties:
        shift:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/CashShift"
        totals:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/CashTotals"
    OpenShiftRequest:
      type: object
      additionalProperties: false
      required: [opening_balance_tiyn]
      properties:
        opening_balance_tiyn:
          type: integer
          format: int64
          description: Начальный остаток кассы (min:0).
    ZReportNonce:
      type: object
      required: [nonce]
      properties:
        nonce:
          type: string
    ZReportPrintedRequest:
      type: object
      additionalProperties: false
      required: [nonce]
      properties:
        nonce:
          type: string
          maxLength: 128
    ZReportPrinted:
      type: object
      required: [printed]
      properties:
        printed:
          type: boolean
    ReceiptLine:
      type: object
      required: [name, quantity, price_tiyn, total_tiyn]
      properties:
        product_id:
          type: integer
          format: int64
          nullable: true
        service_id:
          type: integer
          format: int64
          nullable: true
        name:
          type: string
        quantity:
          type: integer
          format: int64
        price_tiyn:
          type: integer
          format: int64
        total_tiyn:
          type: integer
          format: int64
    ReceiptTopUp:
      type: object
      required: [user_id, balance_type, bonus_tiyn]
      properties:
        user_id:
          type: integer
          format: int64
        balance_type:
          type: string
          enum: [balance, bonus_balance]
        bonus_tiyn:
          type: integer
          format: int64
    CashTransaction:
      type: object
      required: [id, shift_id, type, amount_tiyn, description, created_at]
      properties:
        id:
          type: integer
          format: int64
        shift_id:
          type: integer
          format: int64
        type:
          type: string
          enum: [income, expense]
        amount_tiyn:
          type: integer
          format: int64
        description:
          type: string
          description: Текст операции, как записал старый код (на русском).
        user_id:
          type: integer
          format: int64
          nullable: true
          description: Кто провёл операцию.
        payment_method:
          type: string
          nullable: true
          enum: [cash, card, qr]
        income_kind:
          type: string
          nullable: true
          enum: [top_up, guest_session]
        refund_of_id:
          type: integer
          format: int64
          nullable: true
        items:
          type: array
          description: Строки чека продажи POS.
          items:
            $ref: "#/components/schemas/ReceiptLine"
        top_up:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ReceiptTopUp"
        created_at:
          type: string
          format: date-time
    CashRefundRef:
      type: object
      required: [id, created_at]
      properties:
        id:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
    CashReceipt:
      type: object
      required: [transaction, refund, refundable, can_refund]
      properties:
        transaction:
          $ref: "#/components/schemas/CashTransaction"
        refund:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/CashRefundRef"
        refundable:
          type: boolean
          description: Операция такого вида возвращается (продажа или пополнение).
        can_refund:
          type: boolean
          description: У сотрудника есть право cash.delete.
    CashOperationPage:
      type: object
      required: [shift_id, items, next_before_id]
      properties:
        shift_id:
          type: integer
          format: int64
        items:
          type: array
          items:
            $ref: "#/components/schemas/CashReceipt"
        next_before_id:
          type: integer
          format: int64
          nullable: true
    SaleItem:
      type: object
      additionalProperties: false
      required: [quantity]
      properties:
        product_id:
          type: integer
          format: int64
          nullable: true
        service_id:
          type: integer
          format: int64
          nullable: true
        quantity:
          type: integer
          format: int64
