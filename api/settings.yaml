    DeviceField:
      type: object
      required: [key, label]
      properties:
        key:
          type: string
        label:
          type: string
          description: Подпись поля на языке клуба.
    ZoneProfile:
      type: object
      required: [id, name, description, computers_count, price_per_hour, devices, detected]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
          nullable: true
        computers_count:
          type: integer
          format: int64
        price_per_hour:
          type: integer
          format: int64
          nullable: true
          description: Цена часа зоны, тиыны.
        devices:
          type: object
          description: Оборудование, заполненное клубом.
          additionalProperties:
            type: string
        detected:
          type: object
          description: Подсказки из данных агентов (cpu, gpu, ram) — placeholder полей.
          additionalProperties:
            type: string
    ClubProfilePage:
      type: object
      required: [profile, photos, photo_limit, zones, device_fields]
      properties:
        profile:
          $ref: "#/components/schemas/ClubProfile"
        photos:
          type: array
          description: Фото по порядку показа; первое — обложка.
          items:
            $ref: "#/components/schemas/ClubPhoto"
        photo_limit:
          type: integer
          format: int32
          description: ClubPhoto::LIMIT.
        zones:
          type: array
          items:
            $ref: "#/components/schemas/ZoneProfile"
        device_fields:
          type: array
          items:
            $ref: "#/components/schemas/DeviceField"
    ClubSettingsPage:
      type: object
      required: [club_name, settings, timezone, timezones_kazakhstan, timezones_all, club_time, agent_pin_set_at,
        agent_staff_minutes, can_manage_agent_pin, logo_url, signin_image_url, city, address, cities]
      properties:
        club_name:
          type: string
        settings:
          $ref: "#/components/schemas/ClubSettings"
        timezone:
          type: string
        timezones_kazakhstan:
          type: array
          description: Пояса Казахстана (группа «Казахстан»).
          items:
            $ref: "#/components/schemas/TimezoneOption"
        timezones_all:
          type: array
          description: Все пояса по смещению (группа «Все часовые пояса»).
          items:
            $ref: "#/components/schemas/TimezoneOption"
        club_time:
          type: string
          description: «Сейчас в клубе» — d.m.Y H:i в поясе клуба.
        agent_pin_set_at:
          type: string
          format: date-time
          nullable: true
          description: Когда задан PIN выхода (null — не задан).
        agent_staff_minutes:
          type: integer
          format: int32
        can_manage_agent_pin:
          type: boolean
          description: Право workers.update (PIN и время обслуживания).
        logo_url:
          type: string
          nullable: true
        signin_image_url:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
          description: Ключ города клуба (null — не указан, клуба нет в каталоге приложения).
        address:
          type: string
          nullable: true
        cities:
          type: array
          description: Города по названию на языке клуба (Cities::options()).
          items:
            $ref: "#/components/schemas/CityOption"
    LanguageItem:
      type: object
      required: [code, name, is_enabled]
      properties:
        code:
          type: string
        name:
          type: string
        is_enabled:
          type: boolean
    LanguagesPage:
      type: object
      required: [languages, locale]
      properties:
        languages:
          type: array
          items:
            $ref: "#/components/schemas/LanguageItem"
        locale:
          type: string
          description: Язык клуба (LocaleResolver::forClub()).
    ClubResellerState:
      type: object
      properties:
        reseller:
          allOf:
            - $ref: "#/components/schemas/ClubReseller"
          nullable: true
    ClubReseller:
      type: object
      required: [name, code, discount_percent]
      properties:
        name:
          type: string
        code:
          type: string
        discount_percent:
          type: integer
          description: Скидка на подписку от реселлера; 0 — скидки нет или код реселлера остановлен (текст о скидке не показывается).
    ResellerCodeRequest:
      type: object
      properties:
        reseller_code:
          type: string
          nullable: true
