openapi: 3.0.3
info:
  title: zafirogo API — settings
  version: 0.1.0
  description: |
    Настройки клуба: «Настройка клуба», «Языки», «Финансы», «Гости» (SettingsController, LanguageController,
    ClubLogoController, ClubSignInImageController). Конвенции — api/README.md.
    Настройки — JSON clubs.settings (секции club, finances, guests) и колонки clubs (timezone, locale, PIN выхода,
    agent_staff_minutes, логотип, картинка экрана входа, город, адрес, профиль для приложения). Уровни бонуса и накопительной скидки пишутся в формате v2
    (решение Q-003): пороги — тиыны, проценты — базисные пункты.
    Логотип и картинка экрана входа — публичные GET /club-logos/{club}/{file} и /club-signin-images/{club}/{file}
    (вне /api, без токена: агент грузит их по URL из ClubConfig). Фото клуба — публичный GET /club-photos/{club}/{file}
    (его грузит гостевое приложение).
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /api/settings:
    get:
      operationId: getClubSettings
      tags: [settings]
      summary: Настройки клуба для экранов настроек
      description: |
        Laravel: SettingsController::club(), finances(), guests() (settings.club, settings.view): loadSettings() —
        значения по умолчанию defaultSettings() поверх сохранённых, «минутные» поля нормализованы minutes().
        Плюс часовой пояс и список зон (timezoneOptions()), PIN выхода (дата смены), минуты обслуживания ПК,
        логотип и картинка экрана входа.
      responses:
        "200":
          description: Настройки клуба.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClubSettingsPage"
        "401":
          $ref: "common.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "common.yaml#/components/responses/Forbidden"
  /api/settings/sections/{section}:
    put:
      operationId: saveClubSettings
      tags: [settings]
      summary: Сохранить секцию настроек
      description: |
        Laravel: SettingsController::save() (settings.save, settings.update), SaveSettingsRequest. Меняются только
        поля секции, присутствующие в теле (`$request->has()`); значения — как поля формы (строки, "0"/"1" для
        флажков) или JSON-числа и логические значения. Уровни — список {spent|amount, percent}; пороги — сумма в
        тенге (не больше 2 знаков после точки, решение Q-002), хранятся в формате v2 (Q-003). Журнал
        settings.updated (что было → что стало), аудит категории settings, ConfigChanged агентам клуба.
      parameters:
        - name: section
          in: path
          required: true
          schema:
            type: string
            enum: [club, finances, guests]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsSaveRequest"
      responses:
        "200":
          description: Настройки сохранены.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsMessage"
        "401":
          $ref: "common.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "common.yaml#/components/responses/Forbidden"
        "422":
          $ref: "common.yaml#/components/responses/ValidationFailed"
  /api/settings/timezone:
    put:
      operationId: saveClubTimezone
      tags: [settings]
      summary: Часовой пояс клуба
      description: |
        Laravel: SettingsController::timezone() (settings.timezone): `required|string|timezone:all`; журнал
        club.timezone_changed, если пояс другой.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimezoneRequest"
      responses:
        "200":
          description: Часовой пояс сохранён.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsMessage"
        "401":
          $ref: "common.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "common.yaml#/components/responses/Forbidden"
        "422":
          $ref: "common.yaml#/components/responses/ValidationFailed"
  /api/settings/languages:
    get:
      operationId: getClubLanguages
      tags: [settings]
      summary: Языки и язык клуба
      description: |
        Laravel: SettingsController::languages() (settings.languages): все языки платформы по sort_order, id и
        язык клуба (LocaleResolver::forClub()).
      responses:
        "200":
          description: Языки.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LanguagesPage"
        "401":
          $ref: "common.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "common.yaml#/components/responses/Forbidden"
  /api/settings/language:
    put:
      operationId: saveClubLanguage
      tags: [settings]
      summary: Язык интерфейса клуба
      description: |
        Laravel: LanguageController::select() (settings.language): `required|string|in:<включённые языки>`;
        журнал club.language_changed. Язык клуба виден в /api/auth/me (club.locale) сразу.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LanguageRequest"
      responses:
        "200":
          description: Язык изменён.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsMessage"
        "401":
          $ref: "common.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "common.yaml#/components/responses/Forbidden"
        "422":
          $ref: "common.yaml#/components/responses/ValidationFailed"
  /api/settings/agent-pin:
    put:
      operationId: saveAgentPin
      tags: [settings]
      summary: PIN выхода из агента
      description: |
        Laravel: SettingsController::agentPin() (settings.agent-pin, workers.update): `nullable|string|regex:/^\d{4,8}$/|confirmed`;
        пустой PIN удаляет его. Хранится хэшем (Argon2id). Журнал club.agent_pin_changed, ConfigChanged агентам.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentPinRequest"
      responses:
        "200":
          description: PIN сохранён или удалён.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsMessage"
        "401":
          $ref: "common.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "common.yaml#/components/responses/Forbidden"
        "422":
          $ref: "common.yaml#/components/responses/ValidationFailed"
  /api/settings/agent-staff-time:
    put:
      operationId: saveAgentStaffTime
      tags: [settings]
      summary: Время обслуживания ПК
      description: |
        Laravel: SettingsController::agentStaffTime() (settings.agent-staff-time, workers.update):
        `required|integer|min:1|max:240`; журнал club.agent_staff_time_changed, ConfigChanged агентам.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffTimeRequest"
      responses:
        "200":
          description: Время сохранено.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsMessage"
        "401":
          $ref: "common.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "common.yaml#/components/responses/Forbidden"
        "422":
          $ref: "common.yaml#/components/responses/ValidationFailed"
  /api/settings/logo:
    post:
      operationId: uploadClubLogo
      tags: [settings]
      summary: Загрузить логотип клуба
      description: |
        Laravel: ClubLogoController::update() (settings.logo): `required|file|mimes:png,jpg,jpeg|max:1024|dimensions:min 32×32, max 4096×4096`.
        Журнал club.logo_changed, ConfigChanged агентам (новый URL).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                logo:
                  type: string
                  format: binary
      responses:
        "200":
          description: Логотип сохранён.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsMessage"
        "401":
          $ref: "common.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "common.yaml#/components/responses/Forbidden"
        "422":
          $ref: "common.yaml#/components/responses/ValidationFailed"
    delete:
      operationId: deleteClubLogo
      tags: [settings]
      summary: Удалить логотип клуба
      description: Laravel — ClubLogoController::destroy() (settings.logo.destroy).
      responses:
        "200":
          description: Логотип удалён.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsMessage"
        "401":
          $ref: "common.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "common.yaml#/components/responses/Forbidden"
  /api/settings/signin-image:
    post:
      operationId: uploadSigninImage
      tags: [settings]
      summary: Загрузить картинку экрана входа агента
      description: |
        Laravel: ClubSignInImageController::update() (settings.signin-image): `required|file|mimes:png,jpg,jpeg|max:3072|dimensions:min 640×360, max 4096×4096`.
        Журнал club.signin_image_changed, ConfigChanged агентам.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
      responses:
        "200":
          description: Картинка сохранена.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsMessage"
        "401":
          $ref: "common.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "common.yaml#/components/responses/Forbidden"
        "422":
          $ref: "common.yaml#/components/responses/ValidationFailed"
    delete:
      operationId: deleteSigninImage
      tags: [settings]
      summary: Вернуть стандартную картинку экрана входа
      description: Laravel — ClubSignInImageController::destroy() (settings.signin-image.destroy).
      responses:
        "200":
          description: Картинка удалена.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsMessage"
        "401":
          $ref: "common.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "common.yaml#/components/responses/Forbidden"
  /api/settings/location:
    put:
      operationId: saveClubLocation
      tags: [settings]
      summary: Город и адрес клуба
      description: |
        Laravel: SettingsController::location() (settings.location, settings.update): `city` — nullable, ключ списка
        городов (App\Support\Cities, 25 городов); `address` — nullable|string|max:255. Без города клуба нет в каталоге
        гостевого приложения. Журнал club.location_changed — только если город или адрес изменились.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationRequest"
      responses:
        "200":
          description: Город и адрес сохранены.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsMessage"
        "401":
          $ref: "common.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "common.yaml#/components/responses/Forbidden"
        "422":
          $ref: "common.yaml#/components/responses/ValidationFailed"
  /api/settings/reseller:
    get:
      operationId: getClubReseller
      tags: [settings]
      summary: Реселлер клуба
      description: |
        Карточка «Реселлер» на «Настройке клуба» (settings/club.blade.php, #reseller; тема Д): реселлер, через которого
        подключён клуб, или reseller: null — тогда карточка показывает форму кода. Процент реселлера клубу не отдаётся.
      responses:
        "200":
          description: Реселлер клуба.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClubResellerState"
        "401":
          $ref: "common.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "common.yaml#/components/responses/Forbidden"
    post:
      operationId: attachClubReseller
      tags: [settings]
      summary: Ввести код реселлера
      description: |
        Laravel: SettingsController::reseller() (settings.reseller, settings.update, throttle:10,1). Код вводится один
        раз: клуб уже привязан — 422 по полю reseller_code «Клуб уже привязан к реселлеру. Сменить реселлера можно через
        поддержку Zafiro.»; кода нет или он остановлен — «Реселлер с таким кодом не найден.». Код сравнивается без
        учёта регистра и пробелов по краям. Журнал клуба club.reseller_attached. Сменить или снять реселлера может
        только суперадмин.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResellerCodeRequest"
      responses:
        "200":
          description: Клуб привязан к реселлеру.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsMessage"
        "401":
          $ref: "common.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "common.yaml#/components/responses/Forbidden"
        "422":
          $ref: "common.yaml#/components/responses/ValidationFailed"
        "429":
          $ref: "common.yaml#/components/responses/TooManyRequests"
  /api/settings/profile:
    get:
      operationId: getClubProfile
      tags: [settings]
      summary: Профиль клуба для гостевого приложения
      description: |
        Laravel: ClubProfileController::show() (settings.profile, settings.view): описание и контакты, фото
        (первое — обложка), зоны с числом ПК, ценой часа, оборудованием и подсказками из данных агентов
        (ZoneDevices::detected()).
      responses:
        "200":
          description: Профиль клуба.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClubProfilePage"
        "401":
          $ref: "common.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "common.yaml#/components/responses/Forbidden"
    put:
      operationId: saveClubProfile
      tags: [settings]
      summary: Описание и контакты клуба
      description: |
        Laravel: ClubProfileController::update() (settings.profile.update, settings.update): description ≤ 2000,
        phone ≤ 32 (`/^[+\d\s()\-]+$/`), hours ≤ 100, instagram ≤ 64 (`/^@?[A-Za-z0-9._]+$/`, «@» убирается). Пустые поля
        не хранятся; пустой профиль — NULL. Журнал club.profile_changed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClubProfileRequest"
      responses:
        "200":
          description: Описание клуба сохранено.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsMessage"
        "401":
          $ref: "common.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "common.yaml#/components/responses/Forbidden"
        "422":
          $ref: "common.yaml#/components/responses/ValidationFailed"
  /api/settings/profile/photos:
    post:
      operationId: uploadClubPhotos
      tags: [settings]
      summary: Добавить фото клуба
      description: |
        Laravel: ClubProfileController::storePhotos() (settings.photos.store, settings.update, throttle:20,1):
        `photos` — required|array|max:10; каждое — `file|mimes:jpg,jpeg,png,webp|max:3072|dimensions:200…6000`.
        У клуба не больше 10 фото. Журнал club.photos_added. Поля формы — `photos[]` (как в старой форме) или `photos`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                "photos[]":
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        "200":
          description: Фото добавлены.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsMessage"
        "401":
          $ref: "common.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "common.yaml#/components/responses/Forbidden"
        "422":
          $ref: "common.yaml#/components/responses/ValidationFailed"
        "429":
          $ref: "common.yaml#/components/responses/TooManyRequests"
  /api/settings/profile/photos/{photo}:
    delete:
      operationId: deleteClubPhoto
      tags: [settings]
      summary: Удалить фото клуба
      description: Laravel — ClubProfileController::destroyPhoto() (settings.photos.destroy). Журнал club.photo_deleted.
      parameters:
        - $ref: "#/components/parameters/PhotoId"
      responses:
        "200":
          description: Фото удалено.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsMessage"
        "401":
          $ref: "common.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "common.yaml#/components/responses/NotFound"
  /api/settings/profile/photos/{photo}/cover:
    post:
      operationId: setClubPhotoCover
      tags: [settings]
      summary: Сделать фото обложкой клуба
      description: |
        Laravel — ClubProfileController::coverPhoto() (settings.photos.cover): sort_order = min − 1 (фото становится
        первым). В журнал не пишется.
      parameters:
        - $ref: "#/components/parameters/PhotoId"
      responses:
        "200":
          description: Обложка изменена.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsMessage"
        "401":
          $ref: "common.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "common.yaml#/components/responses/NotFound"
  /api/settings/profile/zones/{zone}:
    put:
      operationId: saveClubZoneProfile
      tags: [settings]
      summary: Описание и оборудование зоны
      description: |
        Laravel — ClubProfileController::updateZone() (settings.profile.zone, settings.update): description ≤ 500,
        devices.<cpu|gpu|ram|monitor|keyboard|mouse|headset|chair> ≤ 120. Пустые значения не хранятся. Журнал
        club.zone_devices_changed.
      parameters:
        - name: zone
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ZoneProfileRequest"
      responses:
        "200":
          description: Зона сохранена.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsMessage"
        "401":
          $ref: "common.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "common.yaml#/components/responses/NotFound"
        "422":
          $ref: "common.yaml#/components/responses/ValidationFailed"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    PhotoId:
      name: photo
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
  schemas:
    SettingsMessage:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: Текст ->with('status', …) на языке клуба.
    SettingsSaveRequest:
      type: object
      description: Поля секции (как поля формы settings.save). Неизвестные поля игнорируются.
      additionalProperties: true
    TimezoneRequest:
      type: object
      properties:
        timezone:
          type: string
          nullable: true
    LanguageRequest:
      type: object
      properties:
        locale:
          type: string
          nullable: true
    AgentPinRequest:
      type: object
      properties:
        pin:
          type: string
          nullable: true
        pin_confirmation:
          type: string
          nullable: true
    StaffTimeRequest:
      type: object
      properties:
        minutes:
          description: Минуты (строка поля формы или число).
          nullable: true
          oneOf:
            - type: string
            - type: integer
    PercentLevel:
      type: object
      required: [threshold_tiyn, percent_bp]
      properties:
        threshold_tiyn:
          type: integer
          format: int64
          description: Порог уровня в тиынах (траты — spent, пополнение — amount).
        percent_bp:
          type: integer
          format: int64
          description: Процент в базисных пунктах (5.5 % = 550).
    SettingsClubSection:
      type: object
      required: [session_idle_timeout, pc_action_after_session_end, pc_restart_after_session_end,
        session_auto_terminate_when_pc_unavailable, booking_interval, max_cashiers_on_shift, max_operators_on_shift,
        agent_idle_logout_minutes, agent_shop_enabled, agent_auto_update, app_booking_enabled, app_booking_cancel]
      properties:
        session_idle_timeout:
          type: number
          format: double
          description: Минуты (не деньги).
        pc_action_after_session_end:
          type: string
        pc_restart_after_session_end:
          type: number
          format: double
        session_auto_terminate_when_pc_unavailable:
          type: number
          format: double
        booking_interval:
          type: number
          format: double
        max_cashiers_on_shift:
          type: number
          format: double
        max_operators_on_shift:
          type: number
          format: double
        agent_idle_logout_minutes:
          type: number
          format: double
        agent_shop_enabled:
          type: boolean
        agent_auto_update:
          type: boolean
        app_booking_enabled:
          type: boolean
          description: Бронь из гостевого приложения включена (club.app_booking_enabled, по умолчанию выключена).
        app_booking_cancel:
          type: boolean
          description: Гость может отменить бронь до начала с возвратом денег (club.app_booking_cancel, по умолчанию да).
    SettingsFinancesSection:
      type: object
      required: [currency, loyalty_enabled, loyalty_levels, topup_bonus_enabled, topup_bonus_levels, discount_scope,
        bonus_max_percent, allow_mixed_payment, allow_whole_balance, auto_billing, auto_billing_pause_minutes]
      properties:
        currency:
          type: string
        loyalty_enabled:
          type: boolean
        loyalty_levels:
          type: array
          items:
            $ref: "#/components/schemas/PercentLevel"
        topup_bonus_enabled:
          type: boolean
        topup_bonus_levels:
          type: array
          items:
            $ref: "#/components/schemas/PercentLevel"
        discount_scope:
          type: string
        bonus_max_percent:
          type: number
          format: double
        allow_mixed_payment:
          type: boolean
        allow_whole_balance:
          type: boolean
        auto_billing:
          type: boolean
        auto_billing_pause_minutes:
          type: number
          format: double
    SettingsGuestsSection:
      type: object
      required: [show_qr_code_on_login, allow_guest_self_transfer, allow_adding_friends,
