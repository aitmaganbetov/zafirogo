        address:
          type: string
          nullable: true
    CityOption:
      type: object
      required: [key, name]
      properties:
        key:
          type: string
        name:
          type: string
          description: Название на языке клуба.
    ClubProfileRequest:
      type: object
      properties:
        description:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        hours:
          type: string
          nullable: true
        instagram:
          type: string
          nullable: true
    ZoneProfileRequest:
      type: object
      properties:
        description:
          type: string
          nullable: true
        devices:
          type: object
          nullable: true
          description: Оборудование зоны — ключ поля → значение (неизвестные ключи игнорируются).
          additionalProperties:
            type: string
            nullable: true
    ClubProfile:
      type: object
      description: clubs.profile (пустых полей нет).
      properties:
        description:
          type: string
        phone:
          type: string
        hours:
          type: string
        instagram:
          type: string
          description: Имя аккаунта без «@».
    ClubPhoto:
      type: object
      required: [id, url]
      properties:
        id:
          type: integer
          format: int64
        url:
          type: string
