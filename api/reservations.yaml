openapi: 3.0.3
info:
  title: zafirogo API — reservations
  version: 0.1.0
  description: |
    Брони ПК (ComputerReservationController, ComputerReservations).
    Конвенции — api/README.md. Время брони в формах — локальное время клуба "Y-m-dTH:i" (как datetime-local).
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /api/reservations:
    get:
      operationId: listReservations
      tags: [reservations]
      summary: Брони дня
      description: |
        Laravel: ComputerReservationController::index() (reservations.index, reservations.view): брони локального дня
        клуба по времени начала, paginate(50); ПК клуба для формы; интервал между бронями; начало по умолчанию.
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Брони дня.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationsPage"
        "401":
          $ref: "common.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "common.yaml#/components/responses/Forbidden"
        "422":
          $ref: "common.yaml#/components/responses/ValidationFailed"
    post:
      operationId: createReservation
      tags: [reservations]
      summary: Новая бронь
      description: |
        Laravel: ComputerReservationController::store() (reservations.store, reservations.create),
        StoreComputerReservationRequest, ComputerReservations::create(). Журнал reservation.created, событие
        computer.reservation_changed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReservationInput"
      responses:
        "201":
          description: ПК забронирован.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationCreated"
        "401":
          $ref: "common.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "common.yaml#/components/responses/Forbidden"
        "422":
          $ref: "common.yaml#/components/responses/ValidationFailed"
  /api/reservations/many:
    post:
      operationId: createReservationsMany
      tags: [reservations]
      summary: Бронь нескольких ПК (карта клуба)
      description: |
        Laravel: ComputerReservationController::storeMany() (reservations.store-many, reservations.create): выбранные
        ПК для одного клиента на один период — все или ни одного.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReservationsManyInput"
      responses:
        "201":
          description: ПК забронированы.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationMessage"
        "401":
          $ref: "common.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "common.yaml#/components/responses/Forbidden"
        "422":
          $ref: "common.yaml#/components/responses/ValidationFailed"
  /api/reservations/customers:
    get:
      operationId: searchReservationCustomers
      tags: [reservations]
      summary: Поиск клиента для брони
      description: |
        Laravel: ComputerReservationController::customers() (reservations.customers, reservations.view, throttle
        60/мин): пользователи клуба по имени или телефону, не больше 10; запрос короче 2 символов — пусто.
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Клиенты.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationCustomers"
        "401":
          $ref: "common.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "common.yaml#/components/responses/Forbidden"
        "422":
          $ref: "common.yaml#/components/responses/ValidationFailed"
        "429":
          $ref: "common.yaml#/components/responses/TooManyRequests"
  /api/reservations/{reservationId}/cancel:
    post:
      operationId: cancelReservation
      tags: [reservations]
      summary: Отменить бронь
      description: |
        Laravel: ComputerReservationController::cancel() (reservations.cancel, reservations.delete),
        ComputerReservations::cancel(). Закрытая бронь — 422 reservation «Эта бронь уже закрыта.».
      parameters:
        - $ref: "#/components/parameters/ReservationId"
      responses:
        "200":
          description: Бронь отменена.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationMessage"
        "401":
          $ref: "common.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "common.yaml#/components/responses/NotFound"
        "422":
          $ref: "common.yaml#/components/responses/ValidationFailed"
  /api/reservations/{reservationId}/arrive:
    post:
      operationId: arriveReservation
      tags: [reservations]
      summary: Клиент пришёл
      description: |
        Laravel: ComputerReservationController::arrive() (reservations.arrive, reservations.update),
        ComputerReservations::arrive().
      parameters:
        - $ref: "#/components/parameters/ReservationId"
      responses:
        "200":
          description: Отмечено.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationMessage"
        "401":
          $ref: "common.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "common.yaml#/components/responses/NotFound"
        "422":
          $ref: "common.yaml#/components/responses/ValidationFailed"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Access-токен из ответа login/refresh (~10 мин).
    refreshCookie:
      type: apiKey
      in: cookie
      name: __Secure-zafiro_rt
      description: Refresh-токен (HttpOnly). Только для /api/auth/refresh и /api/auth/logout.
  parameters:
    ReservationId:
      name: reservationId
      in: path
      required: true
      schema:
        type: integer
        format: int64
  schemas:
    Reservation:
      type: object
      required: [id, computer_id, computer_name, starts_at, ends_at, state, customer_label]
      properties:
        id:
          type: integer
          format: int64
        computer_id:
          type: integer
          format: int64
        computer_name:
          type: string
          nullable: true
          description: displayName() ПК; null — ПК удалён.
        zone_name:
          type: string
          nullable: true
        customer_label:
          type: string
          description: customerLabel() — «имя · телефон» (пусто — нет).
        note:
          type: string
          nullable: true
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        state:
          type: string
          enum: [pending, active, finished, arrived, cancelled]
    ReservationComputer:
      type: object
      required: [id, number, name, zone_name]
      properties:
        id:
          type: integer
          format: int64
        number:
          type: integer
          format: int64
        name:
          type: string
        zone_name:
          type: string
          nullable: true
    ReservationsPage:
      type: object
      required: [date, items, page, per_page, total, computers, gap_minutes, default_start]
      properties:
        date:
          type: string
          description: День (Y-m-d) в поясе клуба.
        items:
          type: array
          items:
            $ref: "#/components/schemas/Reservation"
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
          format: int64
        computers:
          type: array
          items:
            $ref: "#/components/schemas/ReservationComputer"
        gap_minutes:
          type: integer
          format: int64
        default_start:
          type: string
          description: Начало по умолчанию — следующий час клуба (Y-m-dTH:i).
    ReservationInput:
      type: object
      required: [club_computer_id, user_id, starts_at, duration_minutes]
      properties:
        club_computer_id:
          type: integer
          format: int64
          nullable: true
        user_id:
          type: integer
          format: int64
          nullable: true
        starts_at:
          type: string
          description: Локальное время клуба "Y-m-dTH:i".
        duration_minutes:
          type: integer
          format: int64
          nullable: true
        note:
          type: string
          nullable: true
    ReservationsManyInput:
      type: object
      required: [computer_ids, user_id, starts_at, duration_minutes]
      properties:
        computer_ids:
          type: array
          items:
            type: integer
            format: int64
        user_id:
          type: integer
          format: int64
          nullable: true
        starts_at:
          type: string
        duration_minutes:
          type: integer
          format: int64
          nullable: true
        note:
          type: string
          nullable: true
    ReservationCreated:
      type: object
      required: [message, date]
      properties:
        message:
          type: string
        date:
          type: string
          description: День брони (Y-m-d) — список открывается на нём.
    ReservationMessage:
      type: object
      required: [message]
      properties:
        message:
          type: string
    ReservationCustomer:
      type: object
      required: [id, name, phone]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        phone:
          type: string
          nullable: true
    ReservationCustomers:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ReservationCustomer"
