openapi: 3.0.3
info:
  title: zafirogo API — superadmin
  version: 0.1.0
  description: 'Кабинет суперадмина (Этап 3, группа 6): resources/views/superadmin/*. Все операции — только суперадмин (RequireSuperadmin)

    и только на хосте SUPERADMIN_DOMAIN, если он задан (Q-069). Каждое действие пишется в platform_logs и audit_log.



    '
servers:
- url: /
security:
- bearerAuth: []
paths:
  /api/superadmin/dashboard:
    get:
      operationId: saDashboard
      tags:
      - superadmin
      summary: Сервер
      description: 'Laravel: Superadmin\DashboardController (superadmin.dashboard): живой снимок, история по бакетам, нагрузка
        клубов, версии агента, журнал.'
      parameters:
      - name: period
        in: query
        required: false
        schema:
          type: string
          enum:
          - 24h
          - 7d
      - name: clubs
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
        '401':
          $ref: common.yaml#/components/responses/Unauthenticated
        '403':
          $ref: common.yaml#/components/responses/Forbidden
  /api/superadmin/agent-release:
    put:
      operationId: saSetAgentRelease
      tags:
      - superadmin
      summary: Объявить версию агента
      description: 'Laravel: AgentReleaseController::update(). С автообновлением — манифест подписи CI (Ed25519) обязателен;
        ПК со старым агентом получают UpdateAvailable.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentReleaseForm'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: common.yaml#/components/responses/Unauthenticated
        '403':
          $ref: common.yaml#/components/responses/Forbidden
        '422':
          $ref: common.yaml#/components/responses/ValidationFailed
    delete:
      operationId: saClearAgentRelease
      tags:
      - superadmin
      summary: Снять объявление
      description: 'Laravel: AgentReleaseController::destroy().'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: common.yaml#/components/responses/Unauthenticated
        '403':
          $ref: common.yaml#/components/responses/Forbidden
  /api/superadmin/clubs:
    get:
      operationId: saListClubs
      tags:
      - superadmin
      summary: Клубы
      description: 'Laravel: Superadmin\ClubController::index(): по 25.'
      parameters:
      - name: search
        in: query
        required: false
        schema:
          type: string
          maxLength: 100
      - name: subscription
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - inactive
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - name
          - online
          - busy
          - agent_requests
          - api_requests
          - last_login
          - sessions
          - webhooks
          - ends
      - name: direction
        in: query
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
      - &id001
        name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClubList'
        '401':
          $ref: common.yaml#/components/responses/Unauthenticated
        '403':
          $ref: common.yaml#/components/responses/Forbidden
        '422':
          $ref: common.yaml#/components/responses/ValidationFailed
  /api/superadmin/clubs/{clubId}:
    get:
      operationId: saGetClub
      tags:
      - superadmin
      summary: Клуб
      description: 'Laravel: ClubController::show(): участники по 30.'
      parameters:
      - $ref: '#/components/parameters/ClubId'
      - *id001
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClubCard'
        '401':
          $ref: common.yaml#/components/responses/Unauthenticated
        '403':
          $ref: common.yaml#/components/responses/Forbidden
        '404':
          $ref: common.yaml#/components/responses/NotFound
  /api/superadmin/clubs/{clubId}/subscription/extend:
    post:
      operationId: saExtendSubscription
      tags:
      - superadmin
      summary: Продлить подписку
      description: 'Laravel: ClubController::extend().'
      parameters:
      - $ref: '#/components/parameters/ClubId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtendForm'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: common.yaml#/components/responses/Unauthenticated
        '403':
          $ref: common.yaml#/components/responses/Forbidden
        '404':
          $ref: common.yaml#/components/responses/NotFound
        '422':
          $ref: common.yaml#/components/responses/ValidationFailed
  /api/superadmin/clubs/{clubId}/subscription/suspend:
    post:
      operationId: saSuspendSubscription
      tags:
      - superadmin
      summary: Приостановить подписку
      description: 'Laravel: ClubController::suspend().'
      parameters:
      - $ref: '#/components/parameters/ClubId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: common.yaml#/components/responses/Unauthenticated
        '403':
          $ref: common.yaml#/components/responses/Forbidden
        '404':
          $ref: common.yaml#/components/responses/NotFound
  /api/superadmin/clubs/{clubId}/subscription/plan:
    post:
      operationId: saChangeClubPlan
      tags:
      - superadmin
      summary: Сменить тариф клуба
      description: 'Laravel: ClubController::changePlan().'
      parameters:
      - $ref: '#/components/parameters/ClubId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanChoice'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: common.yaml#/components/responses/Unauthenticated
        '403':
          $ref: common.yaml#/components/responses/Forbidden
        '404':
          $ref: common.yaml#/components/responses/NotFound
        '422':
          $ref: common.yaml#/components/responses/ValidationFailed
  /api/superadmin/accounts:
    get:
      operationId: saListAccounts
      tags:
      - superadmin
      summary: Пользователи
      description: 'Laravel: Superadmin\UserController::index(): по 30.'
      parameters:
      - name: search
        in: query
        required: false
        schema:
          type: string
          maxLength: 100
      - name: filter
        in: query
        required: false
        schema:
          type: string
          enum:
          - blocked
          - superadmin
      - *id001
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountList'
        '401':
          $ref: common.yaml#/components/responses/Unauthenticated
        '403':
          $ref: common.yaml#/components/responses/Forbidden
        '422':
          $ref: common.yaml#/components/responses/ValidationFailed
  /api/superadmin/accounts/{userId}/block:
    post:
      operationId: saBlockAccount
      tags:
      - superadmin
      summary: Заблокировать
      description: 'Laravel: UserController::block(): сеансы отзываются сразу.'
      parameters:
      - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: common.yaml#/components/responses/Unauthenticated
        '403':
          $ref: common.yaml#/components/responses/Forbidden
        '404':
          $ref: common.yaml#/components/responses/NotFound
        '422':
          $ref: common.yaml#/components/responses/ValidationFailed
  /api/superadmin/accounts/{userId}/unblock:
    post:
      operationId: saUnblockAccount
      tags:
      - superadmin
      summary: Разблокировать
      description: 'Laravel: UserController::unblock().'
      parameters:
      - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: common.yaml#/components/responses/Unauthenticated
        '403':
          $ref: common.yaml#/components/responses/Forbidden
        '404':
          $ref: common.yaml#/components/responses/NotFound
  /api/superadmin/accounts/{userId}/superadmin:
    post:
      operationId: saGrantSuperadmin
      tags:
      - superadmin
      summary: Выдать права суперадмина
      description: 'Laravel: UserController::grant().'
      parameters:
      - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: common.yaml#/components/responses/Unauthenticated
        '403':
          $ref: common.yaml#/components/responses/Forbidden
        '404':
          $ref: common.yaml#/components/responses/NotFound
        '422':
          $ref: common.yaml#/components/responses/ValidationFailed
    delete:
      operationId: saRevokeSuperadmin
      tags:
      - superadmin
      summary: Снять права суперадмина
      description: 'Laravel: UserController::revoke().'
      parameters:
      - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: common.yaml#/components/responses/Unauthenticated
        '403':
          $ref: common.yaml#/components/responses/Forbidden
        '404':
          $ref: common.yaml#/components/responses/NotFound
        '422':
          $ref: common.yaml#/components/responses/ValidationFailed
  /api/superadmin/plans:
    get:
      operationId: saListPlans
      tags:
      - superadmin
      summary: Тарифы платформы
      description: 'Laravel: PlanController::index().'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanList'
        '401':
          $ref: common.yaml#/components/responses/Unauthenticated
        '403':
          $ref: common.yaml#/components/responses/Forbidden
    post:
      operationId: saCreatePlan
      tags:
      - superadmin
      summary: Создать тариф
      description: 'Laravel: PlanController::store().'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanForm'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: common.yaml#/components/responses/Unauthenticated
        '403':
          $ref: common.yaml#/components/responses/Forbidden
        '422':
          $ref: common.yaml#/components/responses/ValidationFailed
  /api/superadmin/plans/{planId}:
    patch:
      operationId: saUpdatePlan
      tags:
      - superadmin
      summary: Сохранить тариф
      description: 'Laravel: PlanController::update().'
      parameters:
      - $ref: '#/components/parameters/PlanId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanForm'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: common.yaml#/components/responses/Unauthenticated
        '403':
          $ref: common.yaml#/components/responses/Forbidden
        '404':
          $ref: common.yaml#/components/responses/NotFound
        '422':
          $ref: common.yaml#/components/responses/ValidationFailed
  /api/superadmin/logs:
    get:
      operationId: saListLogs
      tags:
      - superadmin
      summary: Журнал
      description: 'Laravel: Superadmin\LogController: вкладки platform/clubs, по 50.'
      parameters:
      - name: tab
        in: query
        required: false
        schema:
          type: string
          enum:
          - platform
          - clubs
      - name: club
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: event
        in: query
        required: false
        schema:
          type: string
          maxLength: 64
      - *id001
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogList'
        '401':
          $ref: common.yaml#/components/responses/Unauthenticated
        '403':
          $ref: common.yaml#/components/responses/Forbidden
        '422':
          $ref: common.yaml#/components/responses/ValidationFailed
  /api/superadmin/platform-news:
    get:
      operationId: saListPlatformNews
      tags:
      - superadmin
      summary: Новости платформы
      description: 'Laravel: Superadmin\NewsController::index(): по 20.'
      parameters:
      - *id001
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformNewsPage'
        '401':
          $ref: common.yaml#/components/responses/Unauthenticated
        '403':
          $ref: common.yaml#/components/responses/Forbidden
    post:
      operationId: saCreatePlatformNews
      tags:
      - superadmin
      summary: Добавить новость
      description: 'Laravel: Superadmin\NewsController::store().'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PlatformNewsForm'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: common.yaml#/components/responses/Unauthenticated
        '403':
          $ref: common.yaml#/components/responses/Forbidden
        '422':
          $ref: common.yaml#/components/responses/ValidationFailed
  /api/superadmin/platform-news/{newsId}:
    patch:
      operationId: saUpdatePlatformNews
      tags:
      - superadmin
      summary: Изменить новость
      description: 'Laravel: Superadmin\NewsController::update().'
      parameters:
      - $ref: '#/components/parameters/NewsId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PlatformNewsForm'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: common.yaml#/components/responses/Unauthenticated
        '403':
          $ref: common.yaml#/components/responses/Forbidden
        '404':
          $ref: common.yaml#/components/responses/NotFound
        '422':
          $ref: common.yaml#/components/responses/ValidationFailed
    delete:
      operationId: saDeletePlatformNews
      tags:
      - superadmin
      summary: Удалить новость
      description: 'Laravel: Superadmin\NewsController::destroy().'
      parameters:
      - $ref: '#/components/parameters/NewsId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: common.yaml#/components/responses/Unauthenticated
        '403':
          $ref: common.yaml#/components/responses/Forbidden
        '404':
          $ref: common.yaml#/components/responses/NotFound
  /api/superadmin/languages:
    get:
      operationId: saListLanguages
      tags:
      - superadmin
      summary: Языки
      description: 'Laravel: LanguageController::index().'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LanguageList'
        '401':
          $ref: common.yaml#/components/responses/Unauthenticated
        '403':
          $ref: common.yaml#/components/responses/Forbidden
    post:
      operationId: saCreateLanguage
      tags:
      - superadmin
      summary: Добавить язык
      description: 'Laravel: LanguageController::store() (languages.store).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LanguageCreate'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: common.yaml#/components/responses/Unauthenticated
        '403':
          $ref: common.yaml#/components/responses/Forbidden
        '422':
          $ref: common.yaml#/components/responses/ValidationFailed
  /api/superadmin/languages/export:
    get:
      operationId: saExportTranslations
      tags:
      - superadmin
      summary: Экспорт CSV
      description: 'Laravel: LanguageController::export() (languages.export).'
      parameters:
      - name: language
        in: query
        required: true
        schema:
          type: string
      - name: missing
        in: query
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: CSV (UTF-8 с BOM, разделитель «;»).
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '401':
          $ref: common.yaml#/components/responses/Unauthenticated
        '403':
          $ref: common.yaml#/components/responses/Forbidden
        '422':
          $ref: common.yaml#/components/responses/ValidationFailed
  /api/superadmin/languages/import:
    post:
      operationId: saImportTranslations
      tags:
      - superadmin
      summary: Импорт CSV
      description: 'Laravel: LanguageController::import() (languages.import, throttle 20/мин).'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImportForm'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResult'
        '401':
          $ref: common.yaml#/components/responses/Unauthenticated
        '403':
          $ref: common.yaml#/components/responses/Forbidden
        '422':
          $ref: common.yaml#/components/responses/ValidationFailed
        '429':
          $ref: common.yaml#/components/responses/TooManyRequests
  /api/superadmin/languages/{languageId}:
    patch:
      operationId: saUpdateLanguage
      tags:
      - superadmin
      summary: Изменить язык
      description: 'Laravel: LanguageController::update().'
      parameters:
      - $ref: '#/components/parameters/LanguageId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LanguageUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: common.yaml#/components/responses/Unauthenticated
        '403':
          $ref: common.yaml#/components/responses/Forbidden
        '404':
          $ref: common.yaml#/components/responses/NotFound
        '422':
          $ref: common.yaml#/components/responses/ValidationFailed
    delete:
      operationId: saDeleteLanguage
      tags:
      - superadmin
      summary: Удалить язык
      description: 'Laravel: LanguageController::destroy().'
      parameters:
      - $ref: '#/components/parameters/LanguageId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: common.yaml#/components/responses/Unauthenticated
        '403':
          $ref: common.yaml#/components/responses/Forbidden
        '404':
          $ref: common.yaml#/components/responses/NotFound
        '422':
          $ref: common.yaml#/components/responses/ValidationFailed
  /api/superadmin/languages/{languageId}/translations:
    get:
      operationId: saListTranslations
      tags:
      - superadmin
      summary: Переводы языка
      description: 'Laravel: LanguageController::translations(): исходный каталог (строки ru), формат Laravel (:name), по
        50.'
      parameters:
      - $ref: '#/components/parameters/LanguageId'
      - name: search
        in: query
        required: false
        schema:
          type: string
          maxLength: 120
      - name: missing
        in: query
        required: false
        schema:
          type: boolean
      - *id001
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslationPage'
        '401':
          $ref: common.yaml#/components/responses/Unauthenticated
        '403':
          $ref: common.yaml#/components/responses/Forbidden
        '404':
          $ref: common.yaml#/components/responses/NotFound
        '422':
          $ref: common.yaml#/components/responses/ValidationFailed
    put:
      operationId: saSaveTranslations
      tags:
      - superadmin
      summary: Сохранить переводы страницы
      description: 'Laravel: LanguageController::saveTranslations(): версия переводов растёт, агентам — TranslationsChanged
        (PD-12).'
      parameters:
      - $ref: '#/components/parameters/LanguageId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TranslationSave'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: common.yaml#/components/responses/Unauthenticated
        '403':
          $ref: common.yaml#/components/responses/Forbidden
        '404':
          $ref: common.yaml#/components/responses/NotFound
        '422':
          $ref: common.yaml#/components/responses/ValidationFailed
  /api/superadmin/telegram:
    get:
      operationId: saTelegram
      tags:
      - superadmin
      summary: Telegram
      description: 'Laravel: TelegramController::show(): токены не возвращаются.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelegramState'
        '401':
          $ref: common.yaml#/components/responses/Unauthenticated
        '403':
          $ref: common.yaml#/components/responses/Forbidden
    post:
      operationId: saSetTelegramGateway
      tags:
      - superadmin
      summary: Подключить Telegram Gateway
      description: 'Laravel: TelegramController::update().'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GatewayForm'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: common.yaml#/components/responses/Unauthenticated
        '403':
          $ref: common.yaml#/components/responses/Forbidden
        '422':
          $ref: common.yaml#/components/responses/ValidationFailed
    delete:
      operationId: saClearTelegramGateway
      tags:
      - superadmin
      summary: Отключить Telegram Gateway
      description: 'Laravel: TelegramController::destroy().'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: common.yaml#/components/responses/Unauthenticated
        '403':
          $ref: common.yaml#/components/responses/Forbidden
  /api/superadmin/telegram/alerts:
    post:
      operationId: saSetTelegramAlerts
      tags:
      - superadmin
      summary: Подключить бота оповещений
      description: 'Laravel: TelegramController::updateAlerts().'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertsForm'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: common.yaml#/components/responses/Unauthenticated
        '403':
          $ref: common.yaml#/components/responses/Forbidden
        '422':
          $ref: common.yaml#/components/responses/ValidationFailed
    delete:
      operationId: saClearTelegramAlerts
      tags:
      - superadmin
      summary: Отключить оповещения
      description: 'Laravel: TelegramController::destroyAlerts().'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: common.yaml#/components/responses/Unauthenticated
        '403':
          $ref: common.yaml#/components/responses/Forbidden
  /api/superadmin/telegram/alerts/test:
    post:
      operationId: saTestTelegramAlerts
      tags:
      - superadmin
      summary: Проверочное сообщение
      description: 'Laravel: TelegramController::testAlerts() (throttle 5/мин).'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: common.yaml#/components/responses/Unauthenticated
        '403':
          $ref: common.yaml#/components/responses/Forbidden
        '422':
          $ref: common.yaml#/components/responses/ValidationFailed
        '429':
          $ref: common.yaml#/components/responses/TooManyRequests
