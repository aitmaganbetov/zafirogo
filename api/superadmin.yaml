openapi: 3.0.3
info:
  title: zafirogo API — superadmin
  version: 0.1.0
  description: 'Кабинет суперадмина (Этап 3, группа 6): resources/views/superadmin/*. Все операции — только суперадмин (RequireSuperadmin)

    и только на хосте SUPERADMIN_DOMAIN, если он задан (Q-069). Каждое действие пишется в platform_logs и audit_log.



    '
servers:
- url: /
security:
- bearerAuth: []
paths:
  /api/superadmin/dashboard:
    get:
      operationId: saDashboard
      tags:
      - superadmin
      summary: Сервер
      description: 'Laravel: Superadmin\DashboardController (superadmin.dashboard): живой снимок, история по бакетам, нагрузка
        клубов, версии агента, журнал.'
      parameters:
      - name: period
        in: query
        required: false
        schema:
          type: string
          enum:
          - 24h
          - 7d
      - name: clubs
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
        '401':
          $ref: common.yaml#/components/responses/Unauthenticated
        '403':
          $ref: common.yaml#/components/responses/Forbidden
  /api/superadmin/agent-release:
    put:
      operationId: saSetAgentRelease
      tags:
      - superadmin
      summary: Объявить версию агента
      description: 'Laravel: AgentReleaseController::update(). С автообновлением — манифест подписи CI (Ed25519) обязателен;
        ПК со старым агентом получают UpdateAvailable.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentReleaseForm'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: common.yaml#/components/responses/Unauthenticated
        '403':
          $ref: common.yaml#/components/responses/Forbidden
        '422':
          $ref: common.yaml#/components/responses/ValidationFailed
    delete:
      operationId: saClearAgentRelease
      tags:
      - superadmin
      summary: Снять объявление
      description: 'Laravel: AgentReleaseController::destroy().'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: common.yaml#/components/responses/Unauthenticated
        '403':
          $ref: common.yaml#/components/responses/Forbidden
  /api/superadmin/clubs:
    get:
      operationId: saListClubs
      tags:
      - superadmin
      summary: Клубы
      description: 'Laravel: Superadmin\ClubController::index(): по 25.'
      parameters:
      - name: search
        in: query
        required: false
        schema:
          type: string
          maxLength: 100
      - name: subscription
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - inactive
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - name
          - online
          - busy
          - agent_requests
          - api_requests
          - last_login
          - sessions
          - webhooks
          - ends
      - name: direction
        in: query
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
      - &id001
        name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClubList'
        '401':
          $ref: common.yaml#/components/responses/Unauthenticated
        '403':
          $ref: common.yaml#/components/responses/Forbidden
        '422':
          $ref: common.yaml#/components/responses/ValidationFailed
  /api/superadmin/clubs/{clubId}:
    get:
      operationId: saGetClub
      tags:
      - superadmin
      summary: Клуб
      description: 'Laravel: ClubController::show(): участники по 30.'
      parameters:
      - $ref: '#/components/parameters/ClubId'
      - *id001
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClubCard'
        '401':
          $ref: common.yaml#/components/responses/Unauthenticated
        '403':
          $ref: common.yaml#/components/responses/Forbidden
        '404':
          $ref: common.yaml#/components/responses/NotFound
  /api/superadmin/clubs/{clubId}/subscription/extend:
    post:
      operationId: saExtendSubscription
      tags:
      - superadmin
      summary: Продлить подписку
      description: 'Laravel: ClubController::extend().'
      parameters:
      - $ref: '#/components/parameters/ClubId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtendForm'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: common.yaml#/components/responses/Unauthenticated
        '403':
          $ref: common.yaml#/components/responses/Forbidden
        '404':
          $ref: common.yaml#/components/responses/NotFound
        '422':
          $ref: common.yaml#/components/responses/ValidationFailed
  /api/superadmin/clubs/{clubId}/subscription/suspend:
    post:
      operationId: saSuspendSubscription
      tags:
      - superadmin
      summary: Приостановить подписку
      description: 'Laravel: ClubController::suspend().'
      parameters:
      - $ref: '#/components/parameters/ClubId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: common.yaml#/components/responses/Unauthenticated
        '403':
          $ref: common.yaml#/components/responses/Forbidden
        '404':
          $ref: common.yaml#/components/responses/NotFound
  /api/superadmin/clubs/{clubId}/subscription/plan:
    post:
      operationId: saChangeClubPlan
      tags:
      - superadmin
      summary: Сменить тариф клуба
      description: 'Laravel: ClubController::changePlan().'
      parameters:
      - $ref: '#/components/parameters/ClubId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanChoice'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: common.yaml#/components/responses/Unauthenticated
        '403':
          $ref: common.yaml#/components/responses/Forbidden
        '404':
          $ref: common.yaml#/components/responses/NotFound
        '422':
          $ref: common.yaml#/components/responses/ValidationFailed
  /api/superadmin/clubs/{clubId}/subscription/discount:
    post:
      operationId: saSetClubDiscount
      tags:
      - superadmin
      summary: Индивидуальная скидка клуба на тариф
      description: 'Laravel: ClubController::discount() (superadmin.clubs.discount). Процент 0…100, срок — последний
        день включительно (не раньше сегодня) или бессрочно, причина до 200 символов; 0 % снимает скидку вместе с датой
        и причиной. Клуб без подписки — 404. Журнал платформы superadmin.subscription_discount_changed. Отличие от Laravel (ревью 22.11.2026): нужен свежий код TOTP действующего суперадмина в теле (поле code; без кода или с неверным/уже использованным — 422 по полю code, лимит superadmin-totp — 429); не в режиме просмотра клуба (403 read_only).'
      parameters:
      - $ref: '#/components/parameters/ClubId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscountForm'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: common.yaml#/components/responses/Unauthenticated
        '403':
          $ref: common.yaml#/components/responses/Forbidden
        '404':
          $ref: common.yaml#/components/responses/NotFound
        '422':
          $ref: common.yaml#/components/responses/ValidationFailed
        '429':
          $ref: common.yaml#/components/responses/TooManyRequests
  /api/superadmin/invoices:
    get:
      operationId: saListInvoices
      tags:
      - superadmin
      summary: Оплаты — счета клубов за подписку
      description: 'Laravel: InvoiceController::index() (superadmin.invoices.index): счета, ожидающие оплаты (старые
        первыми), закрытые (новые первыми, по 30) и настройка Kaspi.'
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceBoard'
        '401':
          $ref: common.yaml#/components/responses/Unauthenticated
        '403':
          $ref: common.yaml#/components/responses/Forbidden
  /api/superadmin/invoices/kaspi:
    post:
      operationId: saSetInvoiceKaspi
      tags:
      - superadmin
      summary: Ссылка на оплату Kaspi и получатель
      description: 'Laravel: InvoiceController::kaspi() (superadmin.invoices.kaspi): url — https, до 500 символов;
        recipient — до 200. Пустая ссылка выключает оплату: клубы не могут выставить счёт. Журнал платформы
        superadmin.billing_kaspi_changed. Отличие от Laravel (ревью 22.11.2026): нужен свежий код TOTP действующего суперадмина в теле (поле code; без кода или с неверным/уже использованным — 422 по полю code, лимит superadmin-totp — 429); не в режиме просмотра клуба (403 read_only).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KaspiForm'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: common.yaml#/components/responses/Unauthenticated
        '403':
          $ref: common.yaml#/components/responses/Forbidden
        '422':
          $ref: common.yaml#/components/responses/ValidationFailed
        '429':
          $ref: common.yaml#/components/responses/TooManyRequests
  /api/superadmin/invoices/{invoiceId}/pay:
    post:
      operationId: saPayInvoice
      tags:
      - superadmin
      summary: Оплата получена — продлить подписку клуба
      description: 'Laravel: InvoiceController::pay(), SubscriptionBilling::markPaid() (superadmin.invoices.pay):
        подписка клуба — тариф счёта, активна ещё N месяцев от конца текущего периода (или от сегодня, BR-183); счёт —
        оплачен. Повтор — 422 invoice «Счёт уже закрыт.». Журнал платформы superadmin.invoice_paid, журнал денег
        платформы invoice_paid:<id>. Отличие от Laravel (ревью 22.11.2026): нужен свежий код TOTP действующего суперадмина в теле (поле code; без кода или с неверным/уже использованным — 422 по полю code, лимит superadmin-totp — 429); не в режиме просмотра клуба (403 read_only).'
      parameters:
      - $ref: '#/components/parameters/InvoiceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecondFactorConfirm'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: common.yaml#/components/responses/Unauthenticated
        '403':
          $ref: common.yaml#/components/responses/Forbidden
        '404':
          $ref: common.yaml#/components/responses/NotFound
        '422':
          $ref: common.yaml#/components/responses/ValidationFailed
        '429':
          $ref: common.yaml#/components/responses/TooManyRequests
  /api/superadmin/invoices/{invoiceId}/cancel:
    post:
      operationId: saCancelInvoice
      tags:
      - superadmin
      summary: Отменить неоплаченный счёт клуба
      description: 'Laravel: InvoiceController::cancel() (superadmin.invoices.cancel). Закрытый счёт — 422 invoice
        «Счёт уже закрыт.». Журнал платформы superadmin.invoice_canceled.'
      parameters:
      - $ref: '#/components/parameters/InvoiceId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: common.yaml#/components/responses/Unauthenticated
        '403':
          $ref: common.yaml#/components/responses/Forbidden
        '404':
          $ref: common.yaml#/components/responses/NotFound
        '422':
          $ref: common.yaml#/components/responses/ValidationFailed
  /api/superadmin/accounts:
    get:
      operationId: saListAccounts
      tags:
      - superadmin
      summary: Пользователи
      description: 'Laravel: Superadmin\UserController::index(): по 30.'
      parameters:
      - name: search
        in: query
        required: false
        schema:
          type: string
          maxLength: 100
      - name: filter
        in: query
        required: false
        schema:
          type: string
          enum:
          - blocked
          - superadmin
      - *id001
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountList'
        '401':
          $ref: common.yaml#/components/responses/Unauthenticated
        '403':
          $ref: common.yaml#/components/responses/Forbidden
        '422':
          $ref: common.yaml#/components/responses/ValidationFailed
  /api/superadmin/accounts/{userId}/block:
    post:
      operationId: saBlockAccount
      tags:
      - superadmin
      summary: Заблокировать
      description: 'Laravel: UserController::block(): сеансы отзываются сразу.'
      parameters:
      - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: common.yaml#/components/responses/Unauthenticated
        '403':
          $ref: common.yaml#/components/responses/Forbidden
        '404':
          $ref: common.yaml#/components/responses/NotFound
        '422':
          $ref: common.yaml#/components/responses/ValidationFailed
  /api/superadmin/accounts/{userId}/unblock:
    post:
      operationId: saUnblockAccount
      tags:
      - superadmin
      summary: Разблокировать
      description: 'Laravel: UserController::unblock().'
      parameters:
      - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: common.yaml#/components/responses/Unauthenticated
        '403':
          $ref: common.yaml#/components/responses/Forbidden
        '404':
          $ref: common.yaml#/components/responses/NotFound
  /api/superadmin/accounts/{userId}/superadmin:
    post:
      operationId: saGrantSuperadmin
      tags:
      - superadmin
      summary: Выдать права суперадмина
      description: 'Laravel: UserController::grant(). Требует свежего кода TOTP действующего суперадмина в теле (аудит A-10): без кода или с неверным/уже использованным — 422 (поле code), лимит superadmin-totp — 429; не в режиме просмотра клуба (403 read_only).'
      parameters:
      - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecondFactorConfirm'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: common.yaml#/components/responses/Unauthenticated
        '403':
          $ref: common.yaml#/components/responses/Forbidden
        '404':
          $ref: common.yaml#/components/responses/NotFound
        '422':
          $ref: common.yaml#/components/responses/ValidationFailed
        '429':
          $ref: common.yaml#/components/responses/TooManyRequests
    delete:
      operationId: saRevokeSuperadmin
      tags:
      - superadmin
      summary: Снять права суперадмина
      description: 'Laravel: UserController::revoke(). Требует свежего кода TOTP действующего суперадмина в теле (аудит A-10): без кода или с неверным/уже использованным — 422 (поле code), лимит superadmin-totp — 429; не в режиме просмотра клуба (403 read_only).'
      parameters:
      - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecondFactorConfirm'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: common.yaml#/components/responses/Unauthenticated
        '403':
          $ref: common.yaml#/components/responses/Forbidden
        '404':
          $ref: common.yaml#/components/responses/NotFound
        '422':
          $ref: common.yaml#/components/responses/ValidationFailed
        '429':
          $ref: common.yaml#/components/responses/TooManyRequests
  /api/superadmin/accounts/{userId}/second-factor:
    delete:
      operationId: saResetSecondFactor
      tags:
      - superadmin
      summary: Сбросить второй фактор суперадмина
      description: 'Этап 7 (новая функция): ключ TOTP и коды восстановления удаляются, сеансы пользователя отзываются;
        при следующем входе — принудительная настройка. Не для своего аккаунта и не в режиме просмотра клуба (403
        read_only). Журнал платформы superadmin.totp_reset и audit_log. Требует свежего кода TOTP действующего
        суперадмина в теле (аудит A-10): без кода или с неверным/уже использованным — 422 (поле code), лимит
        superadmin-totp — 429.'
      parameters:
      - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecondFactorConfirm'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: common.yaml#/components/responses/Unauthenticated
        '403':
          $ref: common.yaml#/components/responses/Forbidden
        '404':
          $ref: common.yaml#/components/responses/NotFound
        '422':
          $ref: common.yaml#/components/responses/ValidationFailed
        '429':
          $ref: common.yaml#/components/responses/TooManyRequests
  /api/superadmin/plans:
    get:
      operationId: saListPlans
      tags:
      - superadmin
      summary: Тарифы платформы
      description: 'Laravel: PlanController::index().'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanList'
        '401':
          $ref: common.yaml#/components/responses/Unauthenticated
        '403':
          $ref: common.yaml#/components/responses/Forbidden
    post:
      operationId: saCreatePlan
      tags:
      - superadmin
      summary: Создать тариф
      description: 'Laravel: PlanController::store().'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanForm'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: common.yaml#/components/responses/Unauthenticated
        '403':
          $ref: common.yaml#/components/responses/Forbidden
        '422':
          $ref: common.yaml#/components/responses/ValidationFailed
  /api/superadmin/plans/{planId}:
    patch:
      operationId: saUpdatePlan
      tags:
      - superadmin
      summary: Сохранить тариф
      description: 'Laravel: PlanController::update().'
      parameters:
      - $ref: '#/components/parameters/PlanId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanForm'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: common.yaml#/components/responses/Unauthenticated
        '403':
          $ref: common.yaml#/components/responses/Forbidden
        '404':
          $ref: common.yaml#/components/responses/NotFound
        '422':
          $ref: common.yaml#/components/responses/ValidationFailed
  /api/superadmin/logs:
    get:
      operationId: saListLogs
      tags:
      - superadmin
      summary: Журнал
      description: 'Laravel: Superadmin\LogController: вкладки platform/clubs, по 50.'
      parameters:
      - name: tab
        in: query
        required: false
        schema:
          type: string
          enum:
          - platform
          - clubs
      - name: club
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: event
        in: query
        required: false
        schema:
          type: string
          maxLength: 64
      - *id001
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogList'
        '401':
          $ref: common.yaml#/components/responses/Unauthenticated
        '403':
          $ref: common.yaml#/components/responses/Forbidden
        '422':
          $ref: common.yaml#/components/responses/ValidationFailed
  /api/superadmin/platform-news:
    get:
      operationId: saListPlatformNews
      tags:
      - superadmin
      summary: Новости платформы
      description: 'Laravel: Superadmin\NewsController::index(): по 20.'
      parameters:
      - *id001
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformNewsPage'
        '401':
          $ref: common.yaml#/components/responses/Unauthenticated
        '403':
          $ref: common.yaml#/components/responses/Forbidden
    post:
      operationId: saCreatePlatformNews
      tags:
      - superadmin
      summary: Добавить новость
      description: 'Laravel: Superadmin\NewsController::store().'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PlatformNewsForm'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: common.yaml#/components/responses/Unauthenticated
        '403':
          $ref: common.yaml#/components/responses/Forbidden
        '422':
          $ref: common.yaml#/components/responses/ValidationFailed
  /api/superadmin/platform-news/{newsId}:
    patch:
      operationId: saUpdatePlatformNews
      tags:
