    patch:
      operationId: saUpdateReseller
      tags:
      - superadmin
      summary: Процент, скидка клубам и «код действует»
      description: 'Laravel: Superadmin\ResellerController::update(). На уже выставленные счета не влияет (счёт хранит
        снимок). Журнал платформы superadmin.reseller_updated (только при изменении) и audit_log. Не в режиме просмотра
        клуба (403 read_only).'
      parameters:
      - $ref: '#/components/parameters/ResellerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResellerTermsForm'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: common.yaml#/components/responses/Unauthenticated
        '403':
          $ref: common.yaml#/components/responses/Forbidden
        '404':
          $ref: common.yaml#/components/responses/NotFound
        '422':
          $ref: common.yaml#/components/responses/ValidationFailed
    delete:
      operationId: saDeleteReseller
      tags:
      - superadmin
      summary: Удалить реселлера
      description: 'Laravel: Superadmin\ResellerController::destroy(): аккаунт остаётся, клубы отвязываются, выплаты
        удаляются каскадом, в счетах начисленное остаётся; суммы выплат и начислений остаются в журнале денег платформы
        (UQ-10). Отличие от Laravel: нужен свежий код TOTP действующего суперадмина в теле (как выдача прав суперадмина,
        аудит A-10) — без кода или с неверным/уже использованным — 422 (поле code), лимит superadmin-totp — 429. Не в
        режиме просмотра клуба (403 read_only).'
      parameters:
      - $ref: '#/components/parameters/ResellerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecondFactorConfirm'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: common.yaml#/components/responses/Unauthenticated
        '403':
          $ref: common.yaml#/components/responses/Forbidden
        '404':
          $ref: common.yaml#/components/responses/NotFound
        '422':
          $ref: common.yaml#/components/responses/ValidationFailed
        '429':
          $ref: common.yaml#/components/responses/TooManyRequests
  /api/superadmin/resellers/{resellerId}/payouts:
    post:
      operationId: saPayoutReseller
      tags:
      - superadmin
      summary: Записать выплату реселлеру
      description: 'Laravel: Superadmin\ResellerController::payout(): сумма 0,01…999 999 999 ₸ (в тиынах), превышение
        остатка не проверяется; выплата не исправляется и не удаляется. В той же транзакции — строка
        reseller_payout:<id выплаты> журнала денег платформы. Отличия от Laravel: заголовок Idempotency-Key (повтор с
        тем же ключом и телом не создаёт вторую выплату, с другим телом — 409) и свежий код TOTP действующего суперадмина
        в теле (422 по полю code, лимит — 429). Не в режиме просмотра клуба (403 read_only).'
      parameters:
      - $ref: '#/components/parameters/ResellerId'
      - $ref: common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResellerPayoutForm'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: common.yaml#/components/responses/BadRequest
        '401':
          $ref: common.yaml#/components/responses/Unauthenticated
        '403':
          $ref: common.yaml#/components/responses/Forbidden
        '404':
          $ref: common.yaml#/components/responses/NotFound
        '409':
          $ref: common.yaml#/components/responses/Conflict
        '422':
          $ref: common.yaml#/components/responses/ValidationFailed
        '429':
          $ref: common.yaml#/components/responses/TooManyRequests
  /api/superadmin/resellers/{resellerId}/clubs/{clubId}:
    delete:
      operationId: saDetachResellerClub
      tags:
      - superadmin
      summary: Отвязать клуб от реселлера
      description: 'Laravel: Superadmin\ResellerController::detach(): новые счета клуба идут без скидки и процента
        реселлера; клуб не этого реселлера — 404. Журнал платформы superadmin.reseller_detached и audit_log. Не в режиме
        просмотра клуба (403 read_only).'
      parameters:
      - $ref: '#/components/parameters/ResellerId'
      - $ref: '#/components/parameters/ClubId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: common.yaml#/components/responses/Unauthenticated
        '403':
          $ref: common.yaml#/components/responses/Forbidden
        '404':
          $ref: common.yaml#/components/responses/NotFound
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Access-токен из ответа login/refresh (~10 мин).
  parameters:
    ClubId:
      name: clubId
      in: path
      required: true
      schema: &id002
        type: integer
        format: int64
    InvoiceId:
      name: invoiceId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    UserId:
      name: userId
      in: path
      required: true
      schema: *id002
    PlanId:
      name: planId
      in: path
      required: true
      schema: *id002
    NewsId:
      name: newsId
      in: path
      required: true
      schema: *id002
    LanguageId:
      name: languageId
      in: path
      required: true
      schema: *id002
    ResellerId:
      name: resellerId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
  schemas:
    SecondFactorConfirm:
      type: object
      description: Свежее подтверждение вторым фактором действующего суперадмина (аудит A-10) — код TOTP из приложения
        (6 цифр). Код восстановления не принимается. Один код — одно действие (повтор шага отклоняется, как при входе).
      required:
      - code
      properties:
        code:
          type: string
          maxLength: 16
    Message:
      type: object
      required:
      - message
      properties:
        message: &id003
          type: string
    ChartLine:
      type: object
      required:
      - label
      - translate
      - color
      - segments
      properties:
        label: *id003
        translate: &id005
          type: boolean
        color: *id003
        segments:
          type: array
          items: *id003
    Chart:
      type: object
      required:
      - lines
      - max_label
      - from_label
      - to_label
      properties:
        lines:
          type: array
          items:
            $ref: '#/components/schemas/ChartLine'
        max_label: *id003
        from_label: &id004
          type: string
          nullable: true
        to_label: *id004
    LogRow:
      type: object
      required:
      - id
      - club_id
      - club_name
      - user_name
      - system
      - event
      - event_label
      - description
      - ip_address
      - at_utc
      properties:
        id: *id002
        club_id: &id006
          type: integer
          format: int64
          nullable: true
        club_name: *id003
        user_name: *id003
        system: *id005
        event: *id003
        event_label: *id004
        description: *id003
        ip_address: *id003
        at_utc: *id003
    Live:
      type: object
      required:
      - load_1
      - load_5
      - load_15
      - load_alert
      - cpu_count
      - memory_percent
      - memory_used_gb
      - memory_total_gb
      - disk_percent
      - disk_used_gb
      - disk_total_gb
      - disk_alert_percent
      - uptime_days
      - queue_pending
      - queue_pending_alert
      - queue_failed
      - queue_oldest_minutes
      - database_mb
      properties:
        load_1: *id004
        load_5: *id004
        load_15: *id004
        load_alert: *id005
        cpu_count:
          type: integer
          nullable: true
        memory_percent:
          type: integer
          nullable: true
        memory_used_gb: *id004
        memory_total_gb: *id004
        disk_percent:
          type: integer
          nullable: true
        disk_used_gb: *id004
        disk_total_gb: *id004
        disk_alert_percent: &id007
          type: integer
        uptime_days: *id006
        queue_pending: *id002
        queue_pending_alert: *id002
        queue_failed: *id002
        queue_oldest_minutes: *id006
        database_mb: *id006
    ClubLoadRow:
      type: object
      required:
      - club_id
      - name
      - requests_per_minute
      - peak
      - agent
      - api
      - panel
      - guest
      - response_ms
      - errors_percent
      - has_errors
      - server_share
      properties:
        club_id: *id002
        name: *id003
        requests_per_minute: *id003
        peak: *id002
        agent: *id003
        api: *id003
        panel: *id003
        guest: *id003
        response_ms: *id004
        errors_percent: *id004
        has_errors: *id005
        server_share: *id004
    ChannelRow:
      type: object
      required:
      - channel
      - label
      - requests_per_minute
      - response_ms
      - errors_percent
      - has_errors
      properties:
        channel: *id003
        label: *id003
        requests_per_minute: *id003
        response_ms: *id004
        errors_percent: *id004
        has_errors: *id005
    TableSize:
      type: object
      required:
      - name
      - megabytes
      - rows
      properties:
        name: *id003
        megabytes: *id003
        rows: *id002
    LogError:
      type: object
      required:
      - at
      - level
      - message
      properties:
        at: *id003
