openapi: 3.0.3
info:
  title: zafirogo API — services
  version: 0.1.0
  description: |
    Услуги клуба (ClubServiceController): PlayStation по часам, распечатка… — продаются в кассе вместе с товарами,
    без склада. Конвенции — api/README.md. Деньги — целые тиыны (integer, int64), никогда number.
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /api/services:
    get:
      operationId: listServices
      tags: [services]
      summary: Услуги клуба
      description: |
        Laravel: ClubServiceController::index() (services.index, services.view): активные сначала, по имени,
        paginate(50); can_create/can_update/can_delete — права сотрудника (кнопки экрана).
      parameters:
        - $ref: "#/components/parameters/Page"
      responses:
        "200":
          description: Страница услуг.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServicePage"
        "401":
          $ref: "common.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "common.yaml#/components/responses/Forbidden"
    post:
      operationId: createService
      tags: [services]
      summary: Добавить услугу
      description: |
        Laravel: ClubServiceController::store() (services.store, services.create): name required|max:150 (trim),
        price numeric|min:0|max:9999999, unit nullable|max:30 (trim, пусто — null), is_active (по умолчанию true).
        Журнал service.created {price, unit}.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceRequest"
      responses:
        "201":
          description: Услуга добавлена.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClubService"
        "401":
          $ref: "common.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "common.yaml#/components/responses/Forbidden"
        "422":
          $ref: "common.yaml#/components/responses/ValidationFailed"
  /api/services/{serviceId}:
    patch:
      operationId: updateService
      tags: [services]
      summary: Изменить услугу
      description: |
        Laravel: ClubServiceController::update() (services.update, services.update): те же правила, что у store.
        Журнал service.updated {price, unit, is_active}.
      parameters:
        - $ref: "#/components/parameters/ServiceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceRequest"
      responses:
        "200":
          description: Услуга сохранена.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClubService"
        "401":
          $ref: "common.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "common.yaml#/components/responses/NotFound"
        "422":
          $ref: "common.yaml#/components/responses/ValidationFailed"
    delete:
      operationId: deleteService
      tags: [services]
      summary: Удалить услугу
      description: |
        Laravel: ClubServiceController::destroy() (services.destroy, services.delete). Чеки хранят имя и цену —
        история не меняется. Журнал service.deleted.
      parameters:
        - $ref: "#/components/parameters/ServiceId"
      responses:
        "200":
          description: Удалённая услуга.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClubService"
        "401":
          $ref: "common.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "common.yaml#/components/responses/NotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Access-токен из ответа login/refresh (~10 мин).
  parameters:
    Page:
      name: page
      in: query
      required: false
      description: Номер страницы (с 1), как ?page= Laravel.
      schema:
        type: integer
        minimum: 1
        maximum: 100000
    ServiceId:
      name: serviceId
      in: path
      required: true
      schema:
        type: integer
        format: int64
  schemas:
    ClubService:
      type: object
      required: [id, name, price_tiyn, unit, is_active]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        price_tiyn:
          type: integer
          format: int64
        unit:
          type: string
          nullable: true
        is_active:
          type: boolean
    ServicePage:
      type: object
      required: [items, total, per_page, can_create, can_update, can_delete]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ClubService"
        total:
          type: integer
          format: int64
        per_page:
          type: integer
        can_create:
          type: boolean
        can_update:
          type: boolean
        can_delete:
          type: boolean
    ServiceRequest:
      type: object
      additionalProperties: false
      required: [name, price_tiyn]
      properties:
        name:
          type: string
        price_tiyn:
          type: integer
          format: int64
          description: Цена (min:0, max:9999999 ₸ = 999 999 900 тиын).
        unit:
          type: string
          nullable: true
        is_active:
          type: boolean
          description: По умолчанию true ($request->boolean('is_active', true)).
